<!DOCTYPE html><html><head><meta charset="UTF-8"><title>icon-modes-check</title></head><body><pre id="out"></pre>
<div class="app" id="app" style="position:absolute;left:-4000px"><aside class="rail" id="rail"></aside><div class="workspace"><header class="topbar" id="header"></header><div class="body" id="appBody"><aside class="panel" id="panel"></aside><main class="stage" id="stage"></main></div></div></div>
<div class="install-overlay hidden" id="installOverlay"><div class="install-panel"><div class="install-panel-header"><h2 id="installTitle">I</h2><button id="installClose">c</button></div><div class="install-body" id="installBody"></div></div></div>
<div class="install-overlay hidden" id="shareOverlay"><div class="install-panel"><div class="install-panel-header"><h2>S</h2><button id="shareClose">c</button></div><div class="install-body"><div class="share-row"><input id="shareUrl"><button id="shareCopyLink">C</button><a id="shareOpen" href="#">o</a></div></div></div></div>
<div class="export-overlay hidden" id="exportOverlay"><div class="export-panel"><div class="export-panel-header"><h2>E</h2><button id="exportClose">x</button></div><div class="export-targets-row"><div class="toggle-group" id="exportTargets"></div><p id="exportNote"></p></div><pre><code id="exportCode"></code></pre><div class="export-actions"><button id="exportCopyBtn">C</button></div></div></div>
<script>try{localStorage.clear()}catch(e){}</script>
<script src="../config.js"></script><script src="../cloud.js"></script><script src="../app.js"></script>
<script>
const F = [];
S.template = 'corporate'; S.showContactIcons = true;
// The social row and the portrait have round shapes of their own, and they
// are not what these treatments govern.
S.socialStyle = 'plain'; S.photoEnabled = false; S.headshotUrl = '';
S.iconColor = '#2B4C7E'; S.accentColor = '#2B4C7E';

// Rounded: a badge, filled, with a corner rather than a circle.
S.contactIconMode = 'rounded';
let h = generateSignaturePreview();
if (!/border-radius:6px/.test(h)) F.push('rounded: no rounded corner in the badge');
if (/border-radius:50%/.test(h.replace(/<!--\[if mso\][\s\S]*?<!\[endif\]-->/g, '').replace(/border-radius:50%;box-sizing/g, '')))
  F.push('rounded: still drawing a circle somewhere');
if (!/background-color:#2B4C7E/i.test(h)) F.push('rounded: the badge is not filled with the theme colour');

// Rule: a coloured bar, no badge.
S.contactIconMode = 'rule';
h = generateSignaturePreview();
if (!/bgcolor="#2B4C7E"/i.test(h)) F.push('rule: no coloured bar');
if (/border-radius:6px|border-radius:50%/.test(h.replace(/<!--\[if !mso\]><!-->[\s\S]*?<!--<!\[endif\]-->/g, '')))
  F.push('rule: drew a badge it should not have');
if (!/<img|<svg/i.test(h)) F.push('rule: no glyph beside the bar');

// Both have to survive the two Outlook variants without carrying anything
// those clients strip.
['rounded','rule'].forEach(function (m) {
  S.contactIconMode = m;
  ['newoutlook','classic'].forEach(function (t) {
    const x = generateExportHTML(t);
    if (/<svg/i.test(x)) F.push(m + '/' + t + ': carries an <svg>');
    if (/data:image/i.test(x)) F.push(m + '/' + t + ': carries an embedded image');
    const vis = x.replace(/<!--\[if !mso\]><!-->[\s\S]*?<!--<!\[endif\]-->/g, '');
    if (t === 'classic' && /border-radius/.test(vis)) F.push(m + '/classic: asks Word for a corner it will discard');
  });
});

// The picker offers them, each with a miniature of its own.
S.contactIconMode = 'circle';
S.openSection = sections.findIndex(function (s) { return s.id === 'design'; });
renderPanel();
const marks = {};
['circle','filled','rounded','rule','icons','letters','labels'].forEach(function (m) {
  const sw = swatchContactIcon(m);
  if (!sw || !sw.trim()) F.push(m + ': no miniature');
  if (marks[sw]) F.push(m + ' and ' + marks[sw] + ' share a miniature');
  marks[sw] = m;
});
document.getElementById('out').textContent = F.length ? F.join('\n')
  : 'rounded and rule draw, survive both Outlooks, and each has its own miniature';
document.title = F.length ? 'FAIL ' + F.length : 'PASS';
</script></body></html>
