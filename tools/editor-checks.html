<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>panel</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" id="rail"></aside>
    <div class="workspace">
      <header class="topbar" id="header"></header>
      <div class="body" id="appBody"><aside class="panel" id="panel"></aside><main class="stage" id="stage"></main></div>
    </div>
  </div>
  <div class="export-overlay hidden" id="exportOverlay"><div class="export-panel">
    <div class="export-panel-header"><h2>E</h2><button class="export-close" id="exportClose">x</button></div>
    <pre class="export-code"><code id="exportCode"></code></pre>
    <div class="export-actions"><button class="btn btn-accent" id="exportCopyBtn">C</button></div></div></div>
  <pre id="report" style="position:fixed;left:0;bottom:0;background:#fff;z-index:99;font:12px monospace"></pre>
  <script>
    window.__errs = [];
    window.onerror = (m, s, l, c) => { window.__errs.push('JS: ' + m + ' @' + l + ':' + c); };
    try { localStorage.clear(); } catch (e) {}
  </script>
  <script src="../config.js"></script>
  <script src="../cloud.js"></script>
  <script src="../app.js"></script>
  <script>
  (function () {
    const E = window.__errs;
    const $ = s => document.querySelector(s);
    const click = el => el && el.dispatchEvent(new MouseEvent('click', {bubbles: true}));

    // Asserted before anything else: later checks assign a headshot, which
    // changes the live value out from under this.
    if (S.headshotUrl !== DEFAULT_HEADSHOT_URL) E.push('a fresh editor does not start on the default portrait');

    // Every rail section must open and render something.
    document.querySelectorAll('#rail [data-goto]').forEach(btn => {
      click(btn);
      const body = $('#panel .sheet-body');
      if (!body || body.innerHTML.trim().length < 40) E.push('empty section: ' + btn.dataset.goto);
    });

    // Templates section: every card must switch the live template.
    click(document.querySelector('#rail [data-goto="0"]'));
    const ids = [].map.call(document.querySelectorAll('#panel [data-tmpl]'), c => c.dataset.tmpl);
    // Counted against the themes rather than a number written here, so adding
    // a layout does not mean remembering to change this line — the fault it
    // guards against is a card that never reached the panel, not a count.
    const themed = Object.keys(templateThemes).length;
    if (ids.length !== themed) E.push('expected ' + themed + ' template cards, got ' + ids.length);
    // Each click re-renders the panel, so the card has to be looked up again
    // every time — a cached NodeList is detached after the first click.
    ids.forEach(want => {
      const c = $('#panel [data-tmpl="' + want + '"]');
      if (!c) { E.push('card vanished: ' + want); return; }
      click(c);
      if (S.template !== want) E.push('card did not select: ' + want);
      if (!$('#stage .signature-container').innerHTML.trim()) E.push('empty preview: ' + want);
      const prev = $('#panel [data-tmpl="' + want + '"] .tmpl-preview');
      if (!prev || !prev.innerHTML.trim()) E.push('empty card preview: ' + want);
    });

    // Maximum width lives with the layout controls, not with Design.
    if (!$('#panel [data-bind="panelWidth"]')) E.push('missing control: panelWidth');

    // Theme matching: switching with it on must change the accent, off must not.
    S.matchTemplateTheme = true;
    click(document.querySelector('#panel [data-tmpl="feature"]'));
    if (S.accentColor !== templateThemes.feature.accent) E.push('theme not applied on switch');
    S.matchTemplateTheme = false;
    S.accentColor = '#123456';
    click(document.querySelector('#panel [data-tmpl="grid"]'));
    if (S.accentColor !== '#123456') E.push('theme applied while matching is off');
    S.matchTemplateTheme = true;

    // Design section: the new controls must be present and must bind.
    click(document.querySelector('#rail [data-goto="1"]'));
    ['headingFont','nameScale','nameTracking'].forEach(k => {
      if (!$('#panel [data-bind="' + k + '"]')) E.push('missing control: ' + k);
    });
    // Colours are swatches that open the picker, not bound inputs.
    ['accentColor','accent2Color'].forEach(k => {
      if (!$('#panel .color-swatch[data-key="' + k + '"]')) E.push('missing colour swatch: ' + k);
    });
    ['roleStyle','contactColumns'].forEach(a => {
      if (!$('#panel [data-action="' + a + '"]')) E.push('missing toggle: ' + a);
    });
    const setRange = (k, v) => {
      const el = $('#panel [data-bind="' + k + '"]');
      if (!el) return;
      el.value = v;
      el.dispatchEvent(new Event('input', {bubbles: true}));
      if (S[k] !== v) E.push(k + ' did not bind (got ' + S[k] + ')');
    };
    setRange('nameScale', 140);
    setRange('nameTracking', 12);
    if (!/letter-spacing:0\.12em/.test(generateSignaturePreview())) E.push('nameTracking inert in output');
    setRange('nameScale', 100);
    setRange('nameTracking', 0);

    // Role style must actually change the markup.
    S.template = 'connect';
    S.roleStyle = 'pill';
    if (!/border-radius:9999px/.test(generateSignaturePreview())) E.push('roleStyle pill inert');
    S.roleStyle = 'plain';

    // Contact columns must actually pair rows.
    S.template = 'brandmark';
    S.contactColumns = 2;
    const two = (generateSignaturePreview().match(/<tr>/g) || []).length;
    S.contactColumns = 1;
    const one = (generateSignaturePreview().match(/<tr>/g) || []).length;
    if (!(two < one)) E.push('contactColumns inert (2col ' + two + ' rows, 1col ' + one + ')');

    // Media section. The sample portraits used to be offered here as a row of
    // stock faces and are not any more — they stay in the code as the default
    // a new account starts with, which is what this checks instead. A picker
    // reappearing would be a regression in the other direction.
    click(document.querySelector("#rail [data-goto=\"2\"]"));
    if (document.querySelectorAll("#panel [data-action=\"sampleHeadshot\"]").length) {
      E.push("the sample portraits picker is back in the media panel");
    }
    if (!$("#panel [data-action=\"headshotUpload\"]")) E.push("headshot upload is missing");
    if (!$("#panel [data-action=\"headshotShape\"]")) E.push("headshot shape control is missing");

    (function () {
      // The portrait sits middle by default: pinned to the top it is marooned
      // at the top of a signature whose text block grows with every contact
      // row and a disclaimer. And the control has to reach every layout that
      // puts a photo beside text, not just the one it was tried on.
      const keepAlign = S.photoAlign, keepTemplate = S.template, keepShow = window.SIGNVEL_SHOW_IMAGES;
      window.SIGNVEL_SHOW_IMAGES = true;

      if (S.photoAlign !== 'middle') E.push('the portrait does not start in the middle');
      const group = $('#panel [data-action="photoAlign"]');
      if (!group) E.push('there is no photo position control');
      else {
        ['top', 'middle', 'bottom'].forEach(v => {
          if (!group.querySelector('[data-val="' + v + '"]')) E.push('photo position has no ' + v + ' option');
        });
        click(group.querySelector('[data-val="bottom"]'));
        if (S.photoAlign !== 'bottom') E.push('the photo position control did not bind');
      }

      ['top', 'middle', 'bottom'].forEach(v => {
        S.photoAlign = v;
        // Only the layouts that set the portrait beside text: this control
        // aligns it against that block, and a layout giving the portrait a row
        // of its own has nothing to align it against. Taken from the app's own
        // list so the two cannot drift.
        PHOTO_BESIDE_TEXT.forEach(id => {
          S.template = id;
          const h = generateSignaturePreview();
          // The cell holding the portrait is the one that has to move. Matched
          // on the photo's own cell rather than anywhere in the markup, since
          // every layout is full of other cells with their own alignment.
          //
          // Both the valign attribute and the CSS are required. Classic
          // Outlook renders with Word, which honours the attribute; dropping
          // it would leave the control working in every preview here and
          // doing nothing in the client most companies actually use.
          // The portrait may be preceded by its Outlook-only VML twin, so the
          // conditional block is allowed for but not required.
          const cell = /<td valign="([a-z]+)" style="vertical-align:([a-z]+);[^"]*"[^>]*>\s*(?:<!--\[if mso\][\s\S]*?<!\[endif\]-->\s*<!--\[if !mso\]><!-->\s*)?<div style="width:\d+px;height:\d+px;border-radius/.exec(h);
          if (!cell) E.push(id + ': could not find the portrait cell with both valign and vertical-align');
          else if (cell[1] !== v || cell[2] !== v) {
            E.push(id + ': portrait cell is valign=' + cell[1] + ' / css ' + cell[2] + ' when position is ' + v);
          }
        });
      });

      S.photoAlign = keepAlign;
      S.template = keepTemplate;
      window.SIGNVEL_SHOW_IMAGES = keepShow;
      click(document.querySelector('#rail [data-goto="2"]'));
    })();

    (function () {
      // The colour picker. It replaced <input type="color">, which handed the
      // choice to the operating system's own dialog — a different window on
      // every platform, and on Windows one that covers the signature being
      // coloured. Everything below is about it behaving like a control rather
      // than like a dialog.
      const keepAccent = S.accentColor;
      click(document.querySelector('#rail [data-goto="1"]'));

      const swatch = $('#panel .color-swatch[data-key="accentColor"]');
      if (!swatch) E.push('no colour swatch to open the picker with');
      if ($('#panel input[type="color"]')) E.push('the operating system colour dialog is still wired up');
      if ($('#panel .picker')) E.push('the picker is open before anything was clicked');

      click(swatch);
      const picker = $('#panel .picker[data-picker="accentColor"]');
      if (!picker) { E.push('clicking the swatch did not open the picker'); }
      else {
        ['.picker-hex', '.picker-sv', '.picker-dot', '.picker-hue'].forEach(sel => {
          if (!picker.querySelector(sel)) E.push('the picker has no ' + sel);
        });

        // Typing a hex has to reach the signature.
        const field = picker.querySelector('.picker-hex');
        field.value = '#C41E3A';
        field.dispatchEvent(new Event('input', {bubbles: true}));
        if (S.accentColor.toUpperCase() !== '#C41E3A') E.push('a typed hex did not apply, got ' + S.accentColor);
        if (generateSignaturePreview().indexOf('#C41E3A') === -1) E.push('a typed hex never reached the signature');

        // Half-typed input must not be applied — it would fight the typing.
        field.value = '#C4';
        field.dispatchEvent(new Event('input', {bubbles: true}));
        if (S.accentColor.toUpperCase() !== '#C41E3A') E.push('an incomplete hex was applied while it was being typed');

        // The hue bar moves the colour, and keeps it visible: a hue change on
        // a black or grey value would otherwise do nothing at all.
        const hue = picker.querySelector('.picker-hue');
        S.accentColor = '#000000';
        hue.value = '210';
        hue.dispatchEvent(new Event('input', {bubbles: true}));
        const after = hexToHsv(S.accentColor);
        if (Math.abs(after.h - 210) > 2) E.push('the hue bar set ' + Math.round(after.h) + ' rather than 210');
        if (after.v < 20 || after.s < 20) E.push('the hue bar left the colour invisible: ' + S.accentColor);

        // Clicking away closes it, and the row goes back to being a row.
        document.dispatchEvent(new PointerEvent('pointerdown', {bubbles: true}));
        if ($('#panel .picker')) E.push('the picker stayed open after a click outside it');
      }

      // The colour maths has to round-trip, or dragging would drift the
      // colour a little further every time it is read back and rewritten.
      ['#5B2EFF', '#C9962B', '#FFFFFF', '#000000', '#1F5E4E'].forEach(hex => {
        const hsv = hexToHsv(hex);
        const back = hsvToHex(hsv.h, hsv.s, hsv.v);
        if (back.toUpperCase() !== hex.toUpperCase()) E.push('colour round-trip lost ' + hex + ' — got ' + back);
      });

      setAccent(keepAccent);
      // Back to Media, which is where the checks below expect to be.
      click(document.querySelector('#rail [data-goto="2"]'));
    })();

    (function () {
      // Role style has to reach every layout. Two of them drew the job title
      // with their own markup and never called the shared renderer, so the
      // control did nothing there — and one of the two was Corporate, which is
      // the template the editor opens on, so for most people it did nothing at
      // all. Minimal is the exception and says so in the panel: it sets the
      // role inline in a single line, where a chip has nowhere to go.
      const keepStyle = S.roleStyle, keepTemplate = S.template;

      Object.keys(templateThemes).forEach(id => {
        if (id === 'minimal') return;
        S.template = id;

        S.roleStyle = 'plain';
        const plain = generateSignaturePreview();
        S.roleStyle = 'pill';
        const pill = generateSignaturePreview();
        S.roleStyle = 'caps';
        const caps = generateSignaturePreview();

        if (pill === plain) E.push(id + ': role style does nothing — pill renders the same as plain');
        if (caps === plain) E.push(id + ': role style does nothing — tracked renders the same as plain');
        if (pill.indexOf('border-radius:9999px') === -1) E.push(id + ': pill draws no pill');
        if (caps.indexOf('letter-spacing:.16em') === -1) E.push(id + ': tracked is not tracked');

        S.roleStyle = 'chip';
        const chip = generateSignaturePreview();
        if (chip.indexOf('border-radius:4px') === -1) E.push(id + ': chip draws no chip');
      });

      S.roleStyle = keepStyle;
      S.template = keepTemplate;
    })();

    (function () {
      // Type. A signature is read in a mail client, and no mail client fetches
      // a webfont — Gmail strips @font-face and Outlook draws with whatever is
      // installed. So every font offered has to be one that is already there,
      // and every one has to actually reach the signature.
      const keepFont = S.font, keepHeading = S.headingFont, keepTemplate = S.template;
      S.template = 'minimal';

      const named = [];
      FONT_CHOICES.forEach(g => g.items.forEach(f => named.push(f)));
      if (named.length < 10) E.push('only ' + named.length + ' fonts offered');

      named.forEach(f => {
        // The stack has to start with the face it is named after, or the name
        // in the panel is not what the reader gets.
        const first = f.stack.split(',')[0].replace(/['"]/g, '').trim();
        if (first !== f.name) E.push(f.name + ': its stack starts with ' + first);
        // And it has to end somewhere generic, so a machine without the face
        // lands on something close rather than on the client's own default.
        if (!/(sans-serif|serif|monospace)$/.test(f.stack.trim())) {
          E.push(f.name + ': stack does not end in a generic family');
        }
        if (fontStack(f.name) !== f.stack) E.push(f.name + ': fontStack() does not resolve it');

        S.font = f.name;
        S.headingFont = '';
        const h = generateSignaturePreview();
        if (h.indexOf(f.stack) === -1) E.push(f.name + ': chosen as the body font but never reaches the signature');
      });

      // Nothing here may be a webfont: a name the machine does not have is a
      // silent substitution the sender never sees.
      const WEBFONTS = /(Inter|Roboto|Lato|Montserrat|Poppins|Open Sans|Source Sans|Nunito|Raleway|Manrope|Work Sans)/i;
      named.forEach(f => {
        if (WEBFONTS.test(f.stack)) E.push(f.name + ': stack names a webfont that will not be there');
      });

      // The display font is a separate choice, and "same as body" has to mean it.
      S.font = 'Georgia';
      S.headingFont = 'Arial';
      const mixed = generateSignaturePreview();
      if (mixed.indexOf(FONT_STACKS['Arial']) === -1) E.push('the display font never reaches the name');
      if (mixed.indexOf(FONT_STACKS['Georgia']) === -1) E.push('the body font was lost when a display font was set');
      S.headingFont = '';
      if (generateSignaturePreview().indexOf(FONT_STACKS['Arial']) !== -1) {
        E.push('"same as body" still uses the old display font');
      }

      // A saved signature naming a font this build no longer offers must not
      // fall through to whatever the client chooses.
      if (fontStack('Comic Sans MS') !== FONT_STACKS['Helvetica Neue']) {
        E.push('an unknown font name does not fall back to the default stack');
      }

      S.font = keepFont; S.headingFont = keepHeading; S.template = keepTemplate;
    })();

    (function () {
      // A signature in a background panel must not grow by the panel's
      // padding: it was clipped in the preview and would be cut by a mail
      // client too, both of which give it roughly 600px and no more.
      //
      // Measured against the width the preview actually offers — the email
      // mock is 680px wide with 20px of padding and a 1px border each side.
      const AVAILABLE = 680 - 40 - 2;
      const keep = {t: S.template, bg: S.bgEnabled, c: S.bgColor, p: S.bgPadding, w: S.panelWidth};
      // Measured as rendered, not read off a width attribute: several layouts
      // have no fixed outer width and inner tables carry widths of their own,
      // so parsing the markup measures the wrong table.
      const widest = (html) => {
        const box = document.createElement('div');
        box.style.cssText = 'position:absolute;left:-10000px;top:0;width:' + AVAILABLE + 'px';
        box.className = 'signature-container';
        box.innerHTML = html;
        document.body.appendChild(box);
        const el = box.firstElementChild;
        const w = el ? Math.max(el.scrollWidth, el.getBoundingClientRect().width) : 0;
        box.remove();
        return Math.round(w);
      };

      S.panelWidth = 0;
      S.bgColor = '#1B5FE0';
      S.bgPadding = 24;

      // Whether a layout is drawn to a fixed width, read off the markup rather
      // than guessed: those are the ones the panel used to widen past what
      // they were drawn for. A content-sized layout has no such width to
      // exceed, and grows by the padding legitimately.
      const isFixed = (html) => {
        const box = document.createElement('div');
        box.innerHTML = html;
        const el = box.firstElementChild;
        return !!(el && el.getAttribute('width'));
      };

      Object.keys(templateThemes).forEach(id => {
        S.template = id;
        S.bgEnabled = false;
        const plainHtml = generateSignaturePreview();
        const plain = widest(plainHtml);
        const fixed = isFixed(plainHtml);
        S.bgEnabled = true;
        const panelled = widest(generateSignaturePreview());
        if (!fixed) {
          if (panelled > AVAILABLE) E.push(id + ': ' + panelled + 'px overflows the ' + AVAILABLE + 'px preview column');
          return;
        }
        // A few pixels of give: the panel's own border-radius and the way a
        // table rounds its columns can land a pixel either side.
        if (panelled > plain + 2) {
          E.push(id + ': the background panel makes it ' + panelled + 'px against ' + plain + 'px without');
        }
        if (panelled > AVAILABLE) {
          E.push(id + ': ' + panelled + 'px overflows the ' + AVAILABLE + 'px preview column');
        }
      });

      // A long disclaimer must not reshape the signature above it. Four
      // layouts had no width at all, so the table stretched to whatever it was
      // pasted into, the browser gave the spare room to the column with the
      // longest run of text, and the identity column was squeezed until the
      // name broke across two lines mid-name.
      //
      // Measured as rendered in a container far wider than any signature, so a
      // layout that stretches shows up as a width that follows the container
      // rather than its own design.
      S.bgEnabled = false;
      S.disclaimerEnabled = false;
      Object.keys(templateThemes).forEach(id => {
        if (id === 'minimal') return;              // one line by design
        S.template = id;
        const bare = widest(generateSignaturePreview());
        S.disclaimerEnabled = true;
        S.disclaimerText = 'The content of this email is confidential and intended for the recipient specified in message only. It is strictly forbidden to share any part of this message with any third party, without a written consent of the sender.';
        const withDisc = widest(generateSignaturePreview());
        S.disclaimerEnabled = false;
        if (withDisc > bare + 2) {
          E.push(id + ': a disclaimer stretches it from ' + bare + 'px to ' + withDisc + 'px');
        }
      });

      // And the name must not break across lines at the width the layout is
      // drawn to. Measured on the rendered name rather than guessed from the
      // character count, since the face and size both matter.
      S.disclaimerEnabled = true;
      Object.keys(templateThemes).forEach(id => {
        S.template = id;
        const box = document.createElement('div');
        box.style.cssText = 'position:absolute;left:-10000px;top:0;width:' + AVAILABLE + 'px';
        box.className = 'signature-container';
        box.innerHTML = generateSignaturePreview();
        document.body.appendChild(box);
        const name = [].slice.call(box.querySelectorAll('p,span'))
          .filter(el => el.textContent.trim() === SAMPLE_IDENTITY.name)[0];
        if (name) {
          const lines = Math.round(name.getBoundingClientRect().height /
            parseFloat(getComputedStyle(name).lineHeight || 20));
          if (lines > 1) E.push(id + ': the name wraps onto ' + lines + ' lines');
        }
        box.remove();
      });
      S.disclaimerEnabled = false;

      // Quiet text has to stay readable on a coloured panel. A fixed grey was
      // picked against near-black and turns to mud on a saturated blue.
      S.template = 'darkcard';
      S.bgEnabled = true;
      S.disclaimerEnabled = true;
      S.disclaimerText = 'Confidential.';
      const onBlue = generateSignaturePreview();
      const disc = /<p style="font-family:[^"]*?color:(#[0-9A-Fa-f]{6});[^"]*">Confidential\./.exec(onBlue);
      if (!disc) E.push('could not find the disclaimer to check its colour');
      else {
        if (/^#8F8CA3$/i.test(disc[1])) E.push('the disclaimer is still the fixed grey on a coloured panel');
        // Legible means clearly lighter than the panel it sits on.
        const lum = (h) => {
          const n = parseInt(h.slice(1), 16);
          return (0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
        };
        if (lum(disc[1]) - lum(S.bgColor) < 0.35) {
          E.push('the disclaimer is only ' + (lum(disc[1]) - lum(S.bgColor)).toFixed(2) + ' lighter than the panel');
        }
      }

      S.template = keep.t; S.bgEnabled = keep.bg; S.bgColor = keep.c;
      S.bgPadding = keep.p; S.panelWidth = keep.w;
      S.disclaimerEnabled = false;
    })();

    (function () {
      // Classic Outlook draws through Word, which ignores border-radius — a
      // round portrait arrives square there unless the markup carries VML as
      // well. Both halves have to be right, and the wrong half showing is the
      // failure that matters: Outlook rendering the photo twice, once as a
      // circle and once as a square underneath it.
      const keepShape = S.headshotShape, keepTemplate = S.template,
            keepShow = window.SIGNVEL_SHOW_IMAGES, keepUrl = S.headshotUrl;
      window.SIGNVEL_SHOW_IMAGES = true;
      S.headshotUrl = DEFAULT_HEADSHOT_URL;
      S.template = 'spotlight';

      S.headshotShape = 'circle';
      const round = generateSignaturePreview();
      if (!/<!--\[if mso\]>.*<v:oval[^>]*>.*<v:fill type="frame" src="[^"]+"\/><\/v:oval>.*<!\[endif\]-->/.test(round)) {
        E.push('circle: no VML oval for classic Outlook, so it renders square there');
      }
      if (round.indexOf('<!--[if !mso]><!-->') === -1 || round.indexOf('<!--<![endif]-->') === -1) {
        E.push('circle: the ordinary markup is not hidden from Outlook, which will draw the photo twice');
      }
      // The VML has to point at the same photograph, not at a stale copy.
      const src = /<v:fill type="frame" src="([^"]+)"/.exec(round);
      if (src && src[1] !== DEFAULT_HEADSHOT_URL) E.push('circle: the VML shows a different image: ' + src[1]);

      S.headshotShape = 'rounded';
      if (!/<v:roundrect[^>]*arcsize="\d+%"/.test(generateSignaturePreview())) {
        E.push('rounded: no VML roundrect for classic Outlook');
      }

      // A square frame needs nothing, and shipping VML for it would be markup
      // Outlook has to parse for no reason.
      S.headshotShape = 'square';
      if (/<v:(oval|roundrect)/.test(generateSignaturePreview())) {
        E.push('square: VML is emitted where there is no shape to draw');
      }

      // Neither does the initials fallback, which is already a plain box.
      S.headshotShape = 'circle';
      S.headshotUrl = null;
      if (/<v:(oval|roundrect)/.test(generateSignaturePreview())) {
        E.push('VML is emitted with no photograph to fill it');
      }

      S.headshotUrl = keepUrl;
      S.headshotShape = keepShape;
      S.template = keepTemplate;
      window.SIGNVEL_SHOW_IMAGES = keepShow;
    })();

    (function () {
      // The same for the logo, in the layouts that give it a cell of its own.
      // Where a layout stacks the logo with text in one cell there is nothing
      // to align against, so those are not asserted — but at least one layout
      // has to respond, or the control is decorative.
      const keepAlign = S.logoAlign, keepTemplate = S.template, keepShow = window.SIGNVEL_SHOW_IMAGES;
      window.SIGNVEL_SHOW_IMAGES = true;

      if (S.logoAlign !== 'middle') E.push('the logo does not start in the middle');
      const group = $('#panel [data-action="logoAlign"]');
      if (!group) E.push('there is no logo position control');
      else {
        ['top', 'middle', 'bottom'].forEach(v => {

      if (generateSignaturePreview().includes(sampleBanners[0].url)) E.push('free: banner image still rendered');
      // Nothing may leak an <img> on a free plan.
      ['spotlight','split','connect','band','grid','feature','corporate'].forEach(id => {
        S.template = id;
        if (/<img\s/i.test(generateSignaturePreview())) E.push('free: ' + id + ' still emits an <img>');
      });
      // And the panel must say why rather than looking broken.
      click(document.querySelector('#rail [data-goto="2"]'));
      if (!$('#panel .inline-note.is-locked')) E.push('free: media panel does not explain the gate');

      window.SIGNVEL_SHOW_IMAGES = keepOverride;
      S.logoUrl = keepLogo; S.headshotUrl = keepShot;
      S.bannerImage = keepBanner; S.bannerEnabled = keepBannerOn;
    })();

    // Export must still produce the same markup the preview shows.
    S.template = 'corporate';
    if (!generateExportHTML().includes('<table')) E.push('export produced no table');

    if (!window.__taglineChecked) E.push('the tagline check never ran');
    document.getElementById('report').textContent = E.length ? E.join('\n') : 'all good';
    document.title = E.length ? 'FAIL ' + E.length : 'PASS';
  })();
  </script>
</body>
</html>
