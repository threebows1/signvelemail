<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>panel</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" id="rail"></aside>
    <div class="workspace">
      <header class="topbar" id="header"></header>
      <div class="body" id="appBody"><aside class="panel" id="panel"></aside><main class="stage" id="stage"></main></div>
    </div>
  </div>
  <div class="export-overlay hidden" id="exportOverlay"><div class="export-panel">
    <div class="export-panel-header"><h2>E</h2><button class="export-close" id="exportClose">x</button></div>
    <pre class="export-code"><code id="exportCode"></code></pre>
    <div class="export-actions"><button class="btn btn-accent" id="exportCopyBtn">C</button></div></div></div>
  <pre id="report" style="position:fixed;left:0;bottom:0;background:#fff;z-index:99;font:12px monospace"></pre>
  <script>
    window.__errs = [];
    window.onerror = (m, s, l, c) => { window.__errs.push('JS: ' + m + ' @' + l + ':' + c); };
    try { localStorage.clear(); } catch (e) {}
  </script>
  <script src="../config.js"></script>
  <script src="../cloud.js"></script>
  <script src="../app.js"></script>
  <script>
  (function () {
    const E = window.__errs;
    const $ = s => document.querySelector(s);
    const click = el => el && el.dispatchEvent(new MouseEvent('click', {bubbles: true}));

    // Asserted before anything else: later checks assign a headshot, which
    // changes the live value out from under this.
    if (S.headshotUrl !== DEFAULT_HEADSHOT_URL) E.push('a fresh editor does not start on the default portrait');

    // Every rail section must open and render something.
    document.querySelectorAll('#rail [data-goto]').forEach(btn => {
      click(btn);
      const body = $('#panel .sheet-body');
      if (!body || body.innerHTML.trim().length < 40) E.push('empty section: ' + btn.dataset.goto);
    });

    // Templates section: every card must switch the live template.
    click(document.querySelector('#rail [data-goto="0"]'));
    const ids = [].map.call(document.querySelectorAll('#panel [data-tmpl]'), c => c.dataset.tmpl);
    if (ids.length !== 17) E.push('expected 17 template cards, got ' + ids.length);
    // Each click re-renders the panel, so the card has to be looked up again
    // every time — a cached NodeList is detached after the first click.
    ids.forEach(want => {
      const c = $('#panel [data-tmpl="' + want + '"]');
      if (!c) { E.push('card vanished: ' + want); return; }
      click(c);
      if (S.template !== want) E.push('card did not select: ' + want);
      if (!$('#stage .signature-container').innerHTML.trim()) E.push('empty preview: ' + want);
      const prev = $('#panel [data-tmpl="' + want + '"] .tmpl-preview');
      if (!prev || !prev.innerHTML.trim()) E.push('empty card preview: ' + want);
    });

    // Maximum width lives with the layout controls, not with Design.
    if (!$('#panel [data-bind="panelWidth"]')) E.push('missing control: panelWidth');

    // Theme matching: switching with it on must change the accent, off must not.
    S.matchTemplateTheme = true;
    click(document.querySelector('#panel [data-tmpl="feature"]'));
    if (S.accentColor !== templateThemes.feature.accent) E.push('theme not applied on switch');
    S.matchTemplateTheme = false;
    S.accentColor = '#123456';
    click(document.querySelector('#panel [data-tmpl="grid"]'));
    if (S.accentColor !== '#123456') E.push('theme applied while matching is off');
    S.matchTemplateTheme = true;

    // Design section: the new controls must be present and must bind.
    click(document.querySelector('#rail [data-goto="1"]'));
    ['headingFont','nameScale','nameTracking','accent2Color'].forEach(k => {
      if (!$('#panel [data-bind="' + k + '"]')) E.push('missing control: ' + k);
    });
    ['roleStyle','contactColumns'].forEach(a => {
      if (!$('#panel [data-action="' + a + '"]')) E.push('missing toggle: ' + a);
    });
    const setRange = (k, v) => {
      const el = $('#panel [data-bind="' + k + '"]');
      if (!el) return;
      el.value = v;
      el.dispatchEvent(new Event('input', {bubbles: true}));
      if (S[k] !== v) E.push(k + ' did not bind (got ' + S[k] + ')');
    };
    setRange('nameScale', 140);
    setRange('nameTracking', 12);
    if (!/letter-spacing:0\.12em/.test(generateSignaturePreview())) E.push('nameTracking inert in output');
    setRange('nameScale', 100);
    setRange('nameTracking', 0);

    // Role style must actually change the markup.
    S.template = 'connect';
    S.roleStyle = 'pill';
    if (!/border-radius:9999px/.test(generateSignaturePreview())) E.push('roleStyle pill inert');
    S.roleStyle = 'plain';

    // Contact columns must actually pair rows.
    S.template = 'brandmark';
    S.contactColumns = 2;
    const two = (generateSignaturePreview().match(/<tr>/g) || []).length;
    S.contactColumns = 1;
    const one = (generateSignaturePreview().match(/<tr>/g) || []).length;
    if (!(two < one)) E.push('contactColumns inert (2col ' + two + ' rows, 1col ' + one + ')');

    // Media section. The sample portraits used to be offered here as a row of
    // stock faces and are not any more — they stay in the code as the default
    // a new account starts with, which is what this checks instead. A picker
    // reappearing would be a regression in the other direction.
    click(document.querySelector("#rail [data-goto=\"2\"]"));
    if (document.querySelectorAll("#panel [data-action=\"sampleHeadshot\"]").length) {
      E.push("the sample portraits picker is back in the media panel");
    }
    if (!$("#panel [data-action=\"headshotUpload\"]")) E.push("headshot upload is missing");
    if (!$("#panel [data-action=\"headshotShape\"]")) E.push("headshot shape control is missing");

    (function () {
      // The portrait sits middle by default: pinned to the top it is marooned
      // at the top of a signature whose text block grows with every contact
      // row and a disclaimer. And the control has to reach every layout that
      // puts a photo beside text, not just the one it was tried on.
      const keepAlign = S.photoAlign, keepTemplate = S.template, keepShow = window.SIGNVEL_SHOW_IMAGES;
      window.SIGNVEL_SHOW_IMAGES = true;

      if (S.photoAlign !== 'middle') E.push('the portrait does not start in the middle');
      const group = $('#panel [data-action="photoAlign"]');
      if (!group) E.push('there is no photo position control');
      else {
        ['top', 'middle', 'bottom'].forEach(v => {
          if (!group.querySelector('[data-val="' + v + '"]')) E.push('photo position has no ' + v + ' option');
        });
        click(group.querySelector('[data-val="bottom"]'));
        if (S.photoAlign !== 'bottom') E.push('the photo position control did not bind');
      }

      ['top', 'middle', 'bottom'].forEach(v => {
        S.photoAlign = v;
        PHOTO_TEMPLATES.forEach(id => {
          S.template = id;
          const h = generateSignaturePreview();
          // The cell holding the portrait is the one that has to move. Matched
          // on the photo's own cell rather than anywhere in the markup, since
          // every layout is full of other cells with their own alignment.
          const cell = /<td style="vertical-align:([a-z]+);[^"]*"[^>]*>\s*<div style="width:\d+px;height:\d+px;border-radius/.exec(h);
          if (!cell) E.push(id + ': could not find the portrait cell');
          else if (cell[1] !== v) E.push(id + ': portrait cell is ' + cell[1] + ' when position is ' + v);
        });
      });

      S.photoAlign = keepAlign;
      S.template = keepTemplate;
      window.SIGNVEL_SHOW_IMAGES = keepShow;
      click(document.querySelector('#rail [data-goto="2"]'));
    })();

    (function () {
      // The same for the logo, in the layouts that give it a cell of its own.
      // Where a layout stacks the logo with text in one cell there is nothing
      // to align against, so those are not asserted — but at least one layout
      // has to respond, or the control is decorative.
      const keepAlign = S.logoAlign, keepTemplate = S.template, keepShow = window.SIGNVEL_SHOW_IMAGES;
      window.SIGNVEL_SHOW_IMAGES = true;

      if (S.logoAlign !== 'middle') E.push('the logo does not start in the middle');
      const group = $('#panel [data-action="logoAlign"]');
      if (!group) E.push('there is no logo position control');
      else {
        ['top', 'middle', 'bottom'].forEach(v => {
          if (!group.querySelector('[data-val="' + v + '"]')) E.push('logo position has no ' + v + ' option');
        });
        click(group.querySelector('[data-val="top"]'));
        if (S.logoAlign !== 'top') E.push('the logo position control did not bind');
      }

      ['top', 'middle', 'bottom'].forEach(v => {
        S.logoAlign = v;
        let moved = 0;
        LOGO_TEMPLATES.forEach(id => {
          S.template = id;
          const h = generateSignaturePreview();
          // The logo's own cell: a td whose content starts with the logo img.
          const cell = /<td [^>]*vertical-align:([a-z]+);[^"]*"[^>]*>\s*<img src="https:\/\/signvel\.com\/sample-/.exec(h);
          if (!cell) return;                        // stacked with text, nothing to align
          moved++;
          if (cell[1] !== v) E.push(id + ': logo cell is ' + cell[1] + ' when position is ' + v);
        });
        if (!moved) E.push('no layout responded to logo position ' + v);
      });

      S.logoAlign = keepAlign;
      S.template = keepTemplate;
      window.SIGNVEL_SHOW_IMAGES = keepShow;
      click(document.querySelector('#rail [data-goto="2"]'));
    })();

    (function () {
      // Removing an image used to be one-way: the sample is a default, so it
      // applies to an account that has never chosen and never again after
      // that. Anyone who cleared a logo in an earlier version was left with a
      // blank slot and no control that would bring it back.
      const keepLogo = S.logoUrl, keepShot = S.headshotUrl;

      S.logoUrl = null; S.headshotUrl = null;
      click(document.querySelector('#rail [data-goto="2"]'));
      const logoChip = $('#panel [data-action="useSample"][data-kind="logo"]');
      const shotChip = $('#panel [data-action="useSample"][data-kind="headshot"]');
      if (!logoChip) E.push('no way back to the sample logo once it is removed');
      if (!shotChip) E.push('no way back to the sample portrait once it is removed');
      if (logoChip) {
        click(logoChip);
        if (S.logoUrl !== DEFAULT_LOGO_URL) E.push('the sample logo control did not restore it');
      }
      if ($('#panel [data-action="useSample"][data-kind="headshot"]')) {
        click($('#panel [data-action="useSample"][data-kind="headshot"]'));
        if (S.headshotUrl !== DEFAULT_HEADSHOT_URL) E.push('the sample portrait control did not restore it');
      }
      // And it stops offering what is already in use.
      click(document.querySelector('#rail [data-goto="2"]'));
      if ($('#panel [data-action="useSample"][data-kind="logo"]')) {
        E.push('the sample logo is offered while it is already in use');
      }

      S.logoUrl = keepLogo; S.headshotUrl = keepShot;
      click(document.querySelector('#rail [data-goto="2"]'));
    })();

    // The default portrait is served from this site, not from a stock host —
    // the sample signature every visitor first sees should not depend on
    // somebody else's CDN, and it has to be an absolute URL because an
    // exported signature is read in a mail client where a relative path
    // resolves against nothing.
    if (!/^https:\/\/signvel\.com\//.test(DEFAULT_HEADSHOT_URL)) {
      E.push('the default headshot is not an absolute signvel.com URL: ' + DEFAULT_HEADSHOT_URL);
    }

    // The sample logo is this product's own lockup, served from this site —
    // not a real company's mark pulled off their WordPress install, which is
    // what it used to be.
    if (!/^https:\/\/signvel\.com\//.test(DEFAULT_LOGO_URL)) {
      E.push('the sample logo is not an absolute signvel.com URL: ' + DEFAULT_LOGO_URL);
    }

    // LOGO_TEMPLATES and PHOTO_TEMPLATES are what the Media panel reads to say
    // "this template has no slot for that". A list that disagrees with the
    // layouts tells people the opposite of what they can see, so both are
    // checked against the layouts rather than trusted. This found two: a
    // retired template still listed, and one that draws a logo but was not.
    (function () {
      const keepTemplate = S.template, keepShow = window.SIGNVEL_SHOW_IMAGES;
      window.SIGNVEL_SHOW_IMAGES = true;
      const keepLogo = S.logoUrl, keepShot = S.headshotUrl;
      S.logoUrl = 'https://example.com/probe-logo.png';
      S.headshotUrl = 'https://example.com/probe-shot.png';

      Object.keys(templateThemes).forEach(id => {
        S.template = id;
        const h = generateSignaturePreview();
        const drawsLogo = h.includes('probe-logo.png');
        const drawsShot = h.includes('probe-shot.png');
        if (drawsLogo !== LOGO_TEMPLATES.includes(id)) {
          E.push(id + (drawsLogo ? ' draws a logo but is not in LOGO_TEMPLATES'
                                 : ' is in LOGO_TEMPLATES but draws no logo'));
        }
        if (drawsShot !== PHOTO_TEMPLATES.includes(id)) {
          E.push(id + (drawsShot ? ' draws a headshot but is not in PHOTO_TEMPLATES'
                                 : ' is in PHOTO_TEMPLATES but draws no headshot'));
        }
      });

      S.logoUrl = keepLogo; S.headshotUrl = keepShot;
      S.template = keepTemplate;
      window.SIGNVEL_SHOW_IMAGES = keepShow;
    })();

    (function () {
      // Every layout with a logo slot shows the sample logo, and an uploaded
      // one replaces it everywhere. Corporate is the single exception while
      // the sample is untouched: it reproduces a real company's signature, so
      // it shows that company's mark.
      const keepLogo = S.logoUrl, keepTemplate = S.template, keepShow = window.SIGNVEL_SHOW_IMAGES;
      window.SIGNVEL_SHOW_IMAGES = true;
      S.logoUrl = DEFAULT_LOGO_URL;

      LOGO_TEMPLATES.forEach(id => {
        S.template = id;
        const h = generateSignaturePreview();
        // Which of the three sample files is right depends on the slot: the
        // ink lockup on a light ground, the white one on a dark layout, and
        // the mark alone where the slot is a panel built around a mark.
        const want = id === 'colorblock' ? [SAMPLE_MARK_WHITE_URL]
                   : [DEFAULT_LOGO_URL, SAMPLE_LOGO_WHITE_URL];
        const shown = want.filter(u => h.includes(u))[0];
        if (!shown) E.push(id + ': does not show the expected sample logo');
        // No layout shows the old brand logo any more, Corporate included.
        if (h.includes(CORPORATE_LOGO_URL)) E.push(id + ": shows the other company's logo");
        if (!shown) return;
        // A logo nobody has seen yet can be any shape. Every slot has to cap
        // its width, or a wide one pushes its column out and squeezes the rest
        // of the layout — which a wordmark did to Colour block.
        const cap = /max-width:(\d+)px/.exec(h.slice(h.indexOf(shown)));
        if (!cap) E.push(id + ': the logo has no width cap, so a wide one can blow out the layout');
        else if (id === 'colorblock' && Number(cap[1]) > 100) {
          E.push('colorblock: the logo may be ' + cap[1] + 'px wide in a 136px panel');
        }
      });

      // An upload wins in every layout, Corporate included.
      S.logoUrl = 'https://cdn.signvel.com/u/mine.png';
      LOGO_TEMPLATES.forEach(id => {
        S.template = id;
        const h = generateSignaturePreview();
        if (!h.includes('mine.png')) E.push(id + ': an uploaded logo did not replace the sample');
        if (h.includes(CORPORATE_LOGO_URL)) E.push(id + ': kept the sample logo over an uploaded one');
      });

      window.SIGNVEL_SHOW_IMAGES = keepShow;
      S.logoUrl = keepLogo;
      S.template = keepTemplate;
    })();

    (function () {
      // The retired logo default follows the new one forward; an uploaded logo
      // is left alone. Same rule as the portrait below.
      const keep = S.logoUrl;
      adoptCloudState({state: {logoUrl: RETIRED_DEFAULT_LOGOS[0]}});
      if (S.logoUrl !== DEFAULT_LOGO_URL) E.push('an old saved signature kept the retired default logo');
      const mine = 'https://cdn.signvel.com/u/mine.png';
      adoptCloudState({state: {logoUrl: mine}});
      if (S.logoUrl !== mine) E.push('an uploaded logo was overwritten by the default');
      S.logoUrl = keep;
    })();

    (function () {
      // A saved signature still carrying a retired default was never a choice
      // anybody made, so it follows the default forward. One that was uploaded
      // or picked is left alone — that distinction is the whole point.
      const keep = S.headshotUrl;

      S.headshotUrl = RETIRED_DEFAULT_HEADSHOTS[0];
      adoptCloudState({state: {headshotUrl: RETIRED_DEFAULT_HEADSHOTS[0]}});
      if (S.headshotUrl !== DEFAULT_HEADSHOT_URL) {
        E.push('an old saved signature kept the retired default portrait');
      }

      const mine = 'https://cdn.signvel.com/u/mine.png';
      adoptCloudState({state: {headshotUrl: mine}});
      if (S.headshotUrl !== mine) E.push('a headshot somebody uploaded was overwritten by the default');

      S.headshotUrl = keep;
    })();

    // Social section: every platform in the catalogue is offered, each one can
    // be switched on, and each builds a real profile URL rather than a '#'.
    click(document.querySelector('#rail [data-goto="4"]'));
    DEFAULT_SOCIAL_LINKS.forEach(def => {
      const row = [].slice.call(document.querySelectorAll('#panel .list-label'))
        .filter(el => el.textContent.trim() === def.label)[0];
      if (!row) { E.push('social panel does not offer ' + def.label); return; }
      if (!socialIcons[def.type]) E.push(def.label + ' has no icon, so it renders blank in a signature');
    });

    (function () {
      // A handle typed into a platform has to reach the signature as a link to
      // that platform. Asserted on the markup, because the URL is built at
      // render time and a missing base silently produces '#'.
      const keep = S.socialLinks.map(sl => Object.assign({}, sl));
      S.socialLinks = S.socialLinks.map(sl =>
        Object.assign({}, sl, {enabled: true, handle: sl.handle || 'signvel'}));
      const h = generateSignaturePreview();
      DEFAULT_SOCIAL_LINKS.forEach(def => {
        const host = {facebook:'facebook.com', linkedin:'linkedin.com', instagram:'instagram.com',
                      youtube:'youtube.com', tiktok:'tiktok.com', x:'x.com', pinterest:'pinterest.com'}[def.type];
        if (!host) { E.push('no expected host listed for ' + def.type); return; }
        if (h.indexOf(host) === -1) E.push(def.label + ' did not reach the signature as a ' + host + ' link');
      });
      S.socialLinks = keep;
    })();

    (function () {
      // The migration that matters: a signature saved before a platform
      // existed carries a list that predates it, and both loadState and
      // adoptCloudState have to top it up. Without this, a new platform only
      // ever reaches people who have never used the editor.
      const keep = S.socialLinks.map(sl => Object.assign({}, sl));
      S.socialLinks = [{type:'linkedin', label:'LinkedIn', handle:'someone', enabled:true}];
      adoptCloudState({state: {socialLinks: S.socialLinks.map(sl => Object.assign({}, sl))}});
      const types = S.socialLinks.map(sl => sl.type);
      DEFAULT_SOCIAL_LINKS.forEach(def => {
        if (types.indexOf(def.type) === -1) E.push('an old saved list was not topped up with ' + def.label);
      });
      const li = S.socialLinks.filter(sl => sl.type === 'linkedin')[0];
      if (!li || li.handle !== 'someone') E.push('topping up the list lost a handle the user had typed');
      const added = S.socialLinks.filter(sl => sl.type === 'pinterest')[0];
      if (added && added.enabled) E.push('a newly added platform arrived switched on, uninvited');
      S.socialLinks = keep;
    })();

    // Banner section: sample banners must be offered once the banner is on.
    click(document.querySelector('#rail [data-goto="5"]'));
    const bt = $('#panel [data-action="toggleBanner"]');
    if (!S.bannerEnabled) click(bt);
    const bans = document.querySelectorAll('#panel [data-action="sampleBanner"]');
    if (bans.length < 4) E.push('expected 4 sample banners, got ' + bans.length);
    click(bans[1]);
    if (S.bannerImage !== bans[1].dataset.url) E.push('sample banner did not apply');

    // Dark panel: every layout must stay readable on a dark ground.
    S.bgEnabled = true; S.bgColor = '#14121F';
    Object.keys(templateThemes).forEach(id => {
      S.template = id;
      const h = generateSignaturePreview();
      if (!h.includes('#14121F')) E.push('bg panel missing on ' + id);
      if (/undefined|NaN/.test(h)) E.push('undefined/NaN on dark: ' + id);
    });
    S.bgEnabled = false;

    // Retired layout names must migrate rather than silently landing on Minimal.
    Object.keys({'side-by-side':'connect', stacked:'brandmark', card:'labelled'}).forEach(old => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({template: old})); } catch (e) {}
      S.template = old;
      loadState();
      if (S.template === old || S.template === 'minimal') E.push('retired template not migrated: ' + old);
    });
    try { localStorage.clear(); } catch (e) {}

    // Identity: the same sample details on every layout, Corporate included,
    // and anything typed wins everywhere. Corporate used to reproduce a real
    // company's signature — it was also the layout the editor opens on, so the
    // first thing anybody saw was somebody else's company.
    S.bgEnabled = false;
    if (!identityIsStock()) E.push('shipped state is not the sample identity');
    S.template = 'corporate';
    const corp = generateSignaturePreview();
    if (!corp.includes(SAMPLE_IDENTITY.name)) E.push('Corporate did not show the sample name');
    if (corp.includes(CORPORATE_IDENTITY.name)) E.push('Corporate still shows the old brand name');
    if (corp.includes(CORPORATE_IDENTITY.contacts.email)) E.push('Corporate still shows the old brand email');
    if (corp.includes(CORPORATE_LOGO_URL)) E.push('Corporate still shows the old brand logo');
    if (!corp.includes(DEFAULT_LOGO_URL)) E.push('Corporate does not show the sample logo');
    ['spotlight','split','grid','feature','minimal'].forEach(id => {
      S.template = id;
      const h = generateSignaturePreview();
      if (!h.includes(SAMPLE_IDENTITY.name)) E.push(id + ' did not show the sample name');
      if (h.includes(CORPORATE_IDENTITY.name)) E.push(id + ' leaked the brand name');
      if (h.includes(CORPORATE_IDENTITY.contacts.email)) E.push(id + ' leaked the brand email');
      if (h.includes(CORPORATE_IDENTITY.contacts.mobile)) E.push(id + ' leaked the brand mobile');
    });
    // A saved state carrying the original Al Riyady details is a copy of the
    // demo, not a choice — it has to behave exactly like the sample state, or
    // anyone upgrading sees the brand details on all seventeen layouts.
    (function () {
      const restore = {name:S.name, title:S.title, company:S.company,
                       fields:S.contactFields.map(f => Object.assign({}, f))};
      S.name = CORPORATE_IDENTITY.name;
      S.title = CORPORATE_IDENTITY.title;
      S.company = CORPORATE_IDENTITY.company;
      S.contactFields = S.contactFields.map(f => (f.type in CORPORATE_IDENTITY.contacts)
        ? Object.assign({}, f, {value: CORPORATE_IDENTITY.contacts[f.type]}) : f);
      if (!identityIsStock()) E.push('saved Al Riyady state not recognised as stock');
      S.template = 'corporate';
      if (generateSignaturePreview().includes(CORPORATE_IDENTITY.name)) {
        E.push('legacy state: Corporate still shows the old brand name');
      }
      ['spotlight','ribbon','band','minimal','corporate'].forEach(id => {
        S.template = id;
        const h = generateSignaturePreview();
        if (!h.includes(SAMPLE_IDENTITY.name)) E.push('legacy state: ' + id + ' did not show the sample name');
        if (h.includes(CORPORATE_IDENTITY.name)) E.push('legacy state: ' + id + ' still shows the brand name');
        if (h.includes(CORPORATE_IDENTITY.contacts.email)) E.push('legacy state: ' + id + ' still shows the brand email');
        if (h.includes(CORPORATE_IDENTITY.contacts.address)) E.push('legacy state: ' + id + ' still shows the brand address');
      });
      S.name = restore.name; S.title = restore.title; S.company = restore.company;
      S.contactFields = restore.fields;
    })();

    // Every retired sample must keep counting as stock. Dropping one freezes
    // those details onto the layouts of everyone still carrying it, which is
    // the bug this list exists to prevent.
    [LEGACY_SIGNVEL_IDENTITY, LEGACY_SAMPLE_IDENTITY].forEach((id, n) => {
      const keep = {name:S.name, title:S.title, company:S.company,
                    fields:S.contactFields.map(f => Object.assign({}, f))};
      S.name = id.name; S.title = id.title; S.company = id.company;
      S.contactFields = S.contactFields.map(f => (f.type in id.contacts)
        ? Object.assign({}, f, {value: id.contacts[f.type]}) : f);
      if (!identityIsStock()) E.push('retired identity ' + n + ' not recognised as stock');
      S.template = 'spotlight';
      const h = generateSignaturePreview();
      if (!h.includes(SAMPLE_IDENTITY.name)) E.push('retired identity ' + n + ': layout did not show the current sample');
      if (h.includes(id.name)) E.push('retired identity ' + n + ': stale name still rendered');
      S.name = keep.name; S.title = keep.title; S.company = keep.company;
      S.contactFields = keep.fields;
    });


    // One edited character stops the substitution.
    S.name = 'Ada Lovelace';
    if (identityIsStock()) E.push('identityIsStock ignored an edited name');
    S.template = 'corporate';
    const edited = generateSignaturePreview();
    if (!edited.includes('Ada Lovelace')) E.push('Corporate ignored the edited name');
    if (edited.includes(CORPORATE_IDENTITY.contacts.email)) E.push('Corporate kept brand contacts after an edit');
    S.name = SAMPLE_IDENTITY.name;
    // An edited contact value counts too, not just the name.
    S.contactFields[0].value = 'ada@example.com';
    if (identityIsStock()) E.push('identityIsStock ignored an edited contact');
    S.contactFields[0].value = SAMPLE_IDENTITY.contacts.email;
    if (!identityIsStock()) E.push('identityIsStock did not recover when restored');

    // The panel must offer name, title and company — without them the editor
    // can only ever produce one person's signature.
    click(document.querySelector('#rail [data-goto="3"]'));
    ['name','title','company'].forEach(k => {
      if (!$('#panel [data-bind="' + k + '"]')) E.push('missing identity field: ' + k);
    });
    const nameInput = $('#panel [data-bind="name"]');
    if (nameInput) {
      nameInput.value = 'Grace Hopper';
      nameInput.dispatchEvent(new Event('input', {bubbles: true}));
      if (S.name !== 'Grace Hopper') E.push('name field did not bind');
      if ($('#panel #stockNote')) E.push('sample-details note survived an edit');
      S.name = SAMPLE_IDENTITY.name;
    }

    // Admin section: hidden and unreachable unless the profile says otherwise.
    // isAdmin() reads Cloud, which is unconfigured here, so this is the
    // signed-out case — the one that matters most.
    if (isAdmin()) E.push('isAdmin true with no cloud session');
    const adminIndex = sections.findIndex(s => s.id === 'admin');
    if (adminIndex < 0) E.push('admin section missing from sections');
    if (document.querySelector('#rail [data-goto="' + adminIndex + '"]')) {
      E.push('admin rail button shown to a non-admin');
    }
    // Landing on it directly must bounce rather than strand the panel.
    S.openSection = adminIndex;
    renderPanel();
    if (S.openSection === adminIndex) E.push('admin section did not bounce a non-admin');
    // And its content must refuse even if called straight.
    if (!/only available to an administrator/.test(renderSectionContent(adminIndex))) {
      E.push('admin panel rendered figures for a non-admin');
    }
    // The panel itself lives at /admin now, so the only thing this section
    // may carry for an admin is the way in — and nothing at all for anyone
    // else. Both halves are asserted: the link must exist when isAdmin() is
    // true, or the rail item becomes a dead end.
    const adminPanel = renderSectionContent(adminIndex);
    if (/admin\.html/.test(adminPanel)) {
      E.push('admin panel offered the way in to a non-admin');
    }
    (function () {
      const keep = window.Cloud;
      window.Cloud = {isReady: true, state: () => ({isAdmin: true})};
      const asAdmin = renderSectionContent(adminIndex);
      if (!/href="admin\.html"/.test(asAdmin)) E.push('admin section has no link to the admin panel');
      window.Cloud = keep;
    })();
    S.openSection = 0;
    renderPanel();

    // Images are gated on an active subscription. The gate has to hide the
    // image without leaving a hole: the layouts already have a monogram and an
    // initials disc for "no image chosen", and that is what should appear.
    (function () {
      const keepOverride = window.SIGNVEL_SHOW_IMAGES;
      const keepLogo = S.logoUrl, keepShot = S.headshotUrl;
      const keepBanner = S.bannerImage, keepBannerOn = S.bannerEnabled;
      S.logoUrl = 'https://example.com/real-logo.png';
      S.headshotUrl = sampleHeadshots[0].url;
      // esc() turns the URL's & into &amp; in the markup, so match on the
      // photo id rather than the whole string.
      const shotId = S.headshotUrl.match(/photo-[0-9a-f-]+/)[0];
      S.bannerImage = sampleBanners[0].url;
      S.bannerEnabled = true;

      window.SIGNVEL_SHOW_IMAGES = true;
      if (!imagesUnlocked()) E.push('override true did not unlock images');

      // Entitlement is a live plan OR an unexpired trial, and imagesUnlocked
      // has to read both. Checked against the real function with the override
      // removed, so this is the code path a signed-in account takes.
      delete window.SIGNVEL_SHOW_IMAGES;
      const realCloud = window.Cloud;
      const asAccount = (o) => {
        window.Cloud = { isReady: true, state: () => Object.assign(
          {ready:true, signedIn:true, email:'a@b.com', userId:'u1', isAdmin:false}, o) };
      };
      asAccount({plan:'free', entitled:true,  trialActive:true });
      if (!imagesUnlocked()) E.push('trial: images stayed locked inside the 30 days');
      asAccount({plan:'free', entitled:false, trialActive:false});
      if (imagesUnlocked()) E.push('expired: images still unlocked after the trial');
      asAccount({plan:'team', entitled:true,  trialActive:false});
      if (!imagesUnlocked()) E.push('paid: images locked on a live plan');
      window.Cloud = realCloud;
      window.SIGNVEL_SHOW_IMAGES = true;
      S.template = 'spotlight';
      const paid = generateSignaturePreview();
      if (!paid.includes(shotId)) E.push('paid: headshot missing');
      S.template = 'split';
      if (!generateSignaturePreview().includes('real-logo.png')) E.push('paid: logo missing');

      window.SIGNVEL_SHOW_IMAGES = false;
      if (imagesUnlocked()) E.push('override false did not lock images');
      S.template = 'spotlight';
      const free = generateSignaturePreview();
      if (free.includes(shotId)) E.push('free: headshot still rendered');
      if (!/<div style="width:\d+px;height:\d+px;background:/.test(free)) E.push('free: no initials fallback drawn');
      S.template = 'split';
      const freeSplit = generateSignaturePreview();
      if (freeSplit.includes('real-logo.png')) E.push('free: logo still rendered');
      if (!freeSplit.includes('Sign Vel')) E.push('free: generated mark missing');
      S.template = 'accentbar';
      if (generateSignaturePreview().includes(sampleBanners[0].url)) E.push('free: banner image still rendered');
      // Nothing may leak an <img> on a free plan.
      ['spotlight','split','connect','band','grid','feature','corporate'].forEach(id => {
        S.template = id;
        if (/<img\s/i.test(generateSignaturePreview())) E.push('free: ' + id + ' still emits an <img>');
      });
      // And the panel must say why rather than looking broken.
      click(document.querySelector('#rail [data-goto="2"]'));
      if (!$('#panel .inline-note.is-locked')) E.push('free: media panel does not explain the gate');

      window.SIGNVEL_SHOW_IMAGES = keepOverride;
      S.logoUrl = keepLogo; S.headshotUrl = keepShot;
      S.bannerImage = keepBanner; S.bannerEnabled = keepBannerOn;
    })();

    // Export must still produce the same markup the preview shows.
    S.template = 'corporate';
    if (!generateExportHTML().includes('<table')) E.push('export produced no table');

    document.getElementById('report').textContent = E.length ? E.join('\n') : 'all good';
    document.title = E.length ? 'FAIL ' + E.length : 'PASS';
  })();
  </script>
</body>
</html>
