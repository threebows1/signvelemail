<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><title>badge</title>
<style>body{background:#fff;margin:0;padding:12px;height:auto;overflow:visible}.big{display:inline-block}</style></head><body>
<div class="app" id="app" style="display:none"><aside class="rail" id="rail"></aside><div class="workspace"><header class="topbar" id="header"></header><div class="body" id="appBody"><aside class="panel" id="panel"></aside><main class="stage" id="stage"></main></div></div></div>
<div class="install-overlay hidden" id="installOverlay"><div class="install-panel"><div class="install-panel-header"><h2 id="installTitle">I</h2><button id="installClose">c</button></div><div class="install-body" id="installBody"></div></div></div>
<div class="install-overlay hidden" id="shareOverlay"><div class="install-panel"><div class="install-panel-header"><h2>S</h2><button id="shareClose">c</button></div><div class="install-body"><div class="share-row"><input id="shareUrl"><button id="shareCopyLink">C</button><a id="shareOpen" href="#">o</a></div></div></div></div>
<div class="export-overlay hidden" id="exportOverlay"><div class="export-panel"><div class="export-panel-header"><h2>E</h2><button id="exportClose">x</button></div><div class="export-targets-row"><div class="toggle-group" id="exportTargets"></div><p id="exportNote"></p></div><pre><code id="exportCode"></code></pre><div class="export-actions"><button id="exportCopyBtn">C</button></div></div></div>
<div class="big" id="big"></div><pre id="meas" style="position:absolute;left:-9999px;font:11px monospace"></pre>
<script src="../config.js"></script><script src="../cloud.js"></script><script src="../app.js"></script>
<script>
// The badge as the signature draws it, on its own and magnified.
S.accentColor = '#2B4C7E'; S.iconColor = ''; S.contactIconMode = 'filled';
S.template = 'corporate';
// Twice, with a pause: the first pass hands back the SVG while the PNGs
// rasterise, and the second picks up the centred PNGs — which is what the
// editor does for real, one redraw once the batch has landed.
generateSignaturePreview();
setTimeout(function () {
const html = onScreen(function () { return generateSignaturePreview(); });
// Keep only the first contact badge — the table the icon sits in.
const d = document.createElement('div');
d.innerHTML = html;
const cell = d.querySelector('td[width][height]');
document.getElementById('big').innerHTML = cell ? cell.closest('table').outerHTML : 'no badge found';
const td = document.querySelector('#big td');
const im = document.querySelector('#big img');
const p = document.getElementById('meas');
if (td && im) {
  const a = td.getBoundingClientRect(), b = im.getBoundingClientRect();
  const cs = getComputedStyle(im);
  p.textContent = 'cell ' + a.width.toFixed(1) + 'x' + a.height.toFixed(1)
    + '  img ' + b.width.toFixed(1) + 'x' + b.height.toFixed(1)
    + '  gaps top ' + (b.top - a.top).toFixed(2) + ' bottom ' + (a.bottom - b.bottom).toFixed(2)
    + '  attrs ' + im.getAttribute('width') + 'x' + im.getAttribute('height')
    + '  natural ' + im.naturalWidth + 'x' + im.naturalHeight
    + '  display ' + cs.display;
}
}, 700);
</script></body></html>
