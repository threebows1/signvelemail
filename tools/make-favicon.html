<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>gen</title></head>
<body style="font-family:system-ui;margin:28px;background:#fff">
<!--
  Sign Vel — favicon generator

  Rasterises the mark for the sizes that still want a bitmap: 180px for iOS
  home screens, 32px for browsers that ignore an SVG icon. Run it headlessly
  with tools/make-favicon.ps1, which writes favicon.png to the repository root.

  The three previews are the point of the page. A favicon is judged at 16px,
  and a mark that reads beautifully at 64 can be a smudge at 16 — which is why
  this uses the masthead's solid white on purple rather than the gradient the
  site uses on white. A gradient at 16px is mud.

  The source is the string below, not favicon.svg, so that one bad path cannot
  leave the two silently disagreeing: change it here and regenerate.
-->
<h1 style="font-size:18px;margin:0 0 18px">Favicon</h1>
<div style="display:flex;align-items:flex-end;gap:26px;margin-bottom:24px">
  <div><canvas id="c180" width="180" height="180" style="border:1px solid #eee;border-radius:8px"></canvas><p style="font:12px monospace;color:#555">180</p></div>
  <div><canvas id="c32" width="32" height="32"></canvas><p style="font:12px monospace;color:#555">32</p></div>
  <div><canvas id="c16" width="16" height="16"></canvas><p style="font:12px monospace;color:#555">16 — the size that decides it</p></div>
</div>
<p><a id="dl" download="favicon.png" style="background:#5B2EFF;color:#fff;font:600 14px system-ui;padding:10px 20px;border-radius:8px;text-decoration:none">Download favicon.png</a></p>
<pre id="out" style="display:none"></pre>

<script>
(function () {
  const SVG =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="180" height="180">' +
      '<rect width="64" height="64" rx="14" fill="#5B2EFF"/>' +
      '<g transform="translate(5 22) scale(0.63)">' +
        '<path d="M8 22c7-16 12-21 16-19 5 2 3 18 7 19s8-13 13-13 4 13 15 9" ' +
              'fill="none" stroke="#FFFFFF" stroke-width="8" ' +
              'stroke-linecap="round" stroke-linejoin="round"/>' +
        '<circle cx="76" cy="27" r="6" fill="#00E5A0"/>' +
      '</g>' +
    '</svg>';

  const img = new Image();
  img.onload = function () {
    [180, 32, 16].forEach(function (n) {
      const c = document.getElementById('c' + n);
      const x = c.getContext('2d');
      x.clearRect(0, 0, n, n);
      x.drawImage(img, 0, 0, n, n);
    });
    const url = document.getElementById('c180').toDataURL('image/png');
    document.getElementById('dl').href = url;
    document.getElementById('out').textContent = url.slice(url.indexOf(',') + 1);
    document.title = 'PASS — favicon rendered';
  };
  img.onerror = function () { document.title = 'FAIL — the svg would not load'; };
  img.src = 'data:image/svg+xml;base64,' + btoa(SVG);
})();
</script>
</body>
</html>
