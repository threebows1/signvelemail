<script>window.__err=[];
window.addEventListener('error',function(e){window.__err.push('error: '+e.message)});
window.addEventListener('unhandledrejection',function(e){window.__err.push('rejected: '+(e.reason && e.reason.message || e.reason))});
try{localStorage.clear();sessionStorage.clear()}catch(e){}</script>
<script src="../config.js"></script>
<script src="../cloud.js"></script>
<script src="../app.js"></script>
<script>
// Reset clears what this browser holds and reloads. The account holds a copy
// too, and reading that back over the defaults is what made a reset undo
// itself — the defaults for a moment, then the old signature again.
const F = [];
const OLD = 'A name from the account';

// Stand in for the cloud layer: signed in, holding an older signature.
let saved = 0, loads = 0;
window.Cloud = {
  isReady: true,
  state: function () { return {signedIn: true, plan: 'team', email: 'daniel@signvel.com'}; },
  onChange: function () {},
  init: function () { return Promise.resolve({signedIn: true}); },
  loadSignature: function () { loads++; return Promise.resolve({state: {name: OLD}}); },
  saveSignature: function () { saved++; return Promise.resolve({ok: true}); },
};

function boot() {
  S.name = 'Daniel Reyes';            // what the defaults give
  return startCloud() || new Promise(function (r) { setTimeout(r, 400); });
}

(async function () {
  // ── An ordinary boot still loads the account's signature ──
  await boot();
  await new Promise(function (r) { setTimeout(r, 400); });
  if (S.name !== OLD) F.push('an ordinary boot did not load the account: name is "' + S.name + '"');

  // ── After a reset it must not ──
  try { sessionStorage.setItem('signvel:reset', '1'); } catch (e) {}
  S.name = 'Daniel Reyes';
  saved = 0;
  await boot();
  await new Promise(function (r) { setTimeout(r, 2200); });   // the save is debounced 1.5s
  if (S.name === OLD) F.push('after a reset the account wrote the old signature back');
  if (!saved) F.push('after a reset the defaults were not saved over the account');

  // ── The mark is spent, so the next boot behaves normally ──
  let left = null;
  try { left = sessionStorage.getItem('signvel:reset'); } catch (e) {}
  if (left) F.push('the reset mark outlived the boot it was for');
  S.name = 'Daniel Reyes';
  await boot();
  await new Promise(function (r) { setTimeout(r, 400); });
  if (S.name !== OLD) F.push('the boot after a reset stopped loading the account');

  // A silent throw in the boot chain would leave the assertions above passing
  // for the wrong reason — nothing ran, so nothing disagreed. It counts as a
  // failure of its own. This check found one: the account panel reads an
  // email off the session, and a stand-in without one rejected the whole
  // chain without a word.
  if ((window.__err || []).length) F.push('the boot threw: ' + window.__err.slice(0, 2).join(' | '));
  if (!loads) F.push('the account was never asked for its signature at all');
  document.getElementById('out').textContent = F.length ? F.join('\n')
    : 'reset ignores the account and writes the defaults over it (' + loads + ' loads, ' + saved + ' save); every other boot loads it';
  document.title = F.length ? 'FAIL ' + F.length : 'PASS';
})();
</script></body></html>
