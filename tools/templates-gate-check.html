<!DOCTYPE html><html><head><meta charset="UTF-8"><title>gate</title>
<style>body{margin:0;font:12px monospace}iframe{width:1100px;height:700px;border:0}</style></head>
<body>
<iframe id="f" src="../templates.html"></iframe>
<pre id="out"></pre>
<script>
// templates.html is held back from search and from signed-out visitors.
//
// Two separate things are checked, and they have to be checked separately:
//
//  * The source. Read with fetch() rather than off the iframe, because when
//    the gate works the iframe is no longer showing templates.html by the
//    time a load event is worth inspecting — it has already redirected, and
//    every assertion about the markup would then be read off editor.html and
//    fail for the wrong reason.
//
//  * The behaviour. Either outcome is correct: a redirect means the cloud
//    layer loaded and found nobody signed in; a revealed page means it could
//    not load at all and the gate failed open. The failure with teeth is the
//    third case — neither, leaving a permanently blank page.
window.addEventListener('error', function (e) {
  document.title = 'ERROR';
  document.getElementById('out').textContent = (e.message || 'unknown') + ' @line ' + (e.lineno || '?');
});

const E = [];
let staticDone = false, behaviourDone = false;

function report(note) {
  if (!staticDone || !behaviourDone) return;
  document.getElementById('out').textContent = E.length ? E.join('\n') : 'ok — ' + note;
  document.title = E.length ? 'FAIL ' + E.length : 'PASS';
}

// ── 1. The source ──
fetch('../templates.html').then(r => r.text()).then(function (src) {
  const head = src.slice(0, src.indexOf('</head>'));

  if (!/<meta\s+name="robots"[^>]*content="[^"]*noindex/i.test(head)) {
    E.push('head does not carry a noindex robots meta');
  }
  ['config.js', 'cloud.js'].forEach(f => {
    if (src.indexOf('src="' + f + '"') === -1) E.push('does not load ' + f);
  });
  if (!/supabase-js/.test(src)) E.push('does not load supabase-js');

  // The hiding rule must be keyed off a class the script adds, not one written
  // into the markup, so scripting:off shows the page instead of a blank.
  if (/<body[^>]*class="[^"]*gate-pending/.test(src)) {
    E.push('gate-pending is written into the body tag — scripting off would blank the page');
  }
  if (!/classList\.add\('gate-pending'\)/.test(src)) E.push('nothing adds the gate class');
  if (!/editor\.html#signin/.test(src)) E.push('gate does not redirect to the sign-in panel');
  // Whatever goes wrong upstream, the page must not stay hidden.
  if (!/setTimeout/.test(src)) E.push('no fallback that reveals the page if the cloud layer never answers');

  staticDone = true;
  report(note);
}).catch(function (e) {
  E.push('could not read templates.html: ' + e.message);
  staticDone = true;
  report(note);
});

// ── 2. The behaviour ──
let note = '';
const frame = document.getElementById('f');
setTimeout(function () {
  const w = frame.contentWindow;
  let href = '';
  try { href = w.location.href; } catch (e) { href = '(cross-origin)'; }

  // Matched on the path, not the fragment: the editor reads #signin and then
  // clears it with history.replaceState, so by the time this runs the href is
  // a bare editor.html and looking for the fragment finds nothing.
  if (/\/editor\.html(?:[#?].*)?$/.test(href)) {
    note = 'noindex set; signed out, redirected to the editor sign-in panel';
  } else {
    const d = frame.contentDocument;
    const vis = d ? w.getComputedStyle(d.body).visibility : 'no document';
    if (vis !== 'visible') {
      E.push('neither redirected nor revealed — page left hidden (visibility: ' + vis + ')');
    } else if (d.documentElement.classList.contains('gate-pending')) {
      E.push('gate-pending never lifted');
    } else if (!d.querySelector('.tmpl-gallery')) {
      E.push('revealed, but the gallery markup is missing');
    }
    note = 'noindex set; no cloud available, page revealed rather than left blank';
  }

  behaviourDone = true;
  report(note);
}, 4000);
</script>
</body></html>
