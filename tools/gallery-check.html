<!DOCTYPE html><html><head><meta charset="UTF-8"><title>gallery</title>
<style>body{margin:0;font:12px monospace}iframe{width:1280px;height:900px;border:0}</style></head>
<body>
<iframe id="f" src="../index.html"></iframe>
<pre id="out"></pre>
<script>
document.getElementById('f').addEventListener('load', function () {
  const d = this.contentDocument;
  const E = [];
  const tabs = [].slice.call(d.querySelectorAll('.gallery-tab'));
  const panels = [].slice.call(d.querySelectorAll('.gallery-panel'));

  if (!tabs.length) E.push('no tabs found');
  if (tabs.length !== panels.length) E.push('tabs ' + tabs.length + ' but panels ' + panels.length);

  // Exactly one panel visible at rest.
  const visible = () => panels.filter(p => !p.hidden);
  if (visible().length !== 1) E.push('at rest ' + visible().length + ' panels visible, want 1');
  if (!tabs[0].classList.contains('is-on')) E.push('first tab not marked on at rest');

  // Every tab selects its own panel, and only its own.
  tabs.forEach((t, i) => {
    t.dispatchEvent(new MouseEvent('click', {bubbles: true}));
    const shown = visible();
    if (shown.length !== 1) E.push(t.textContent + ': ' + shown.length + ' panels visible');
    else if (shown[0].id !== 'panel-' + t.dataset.sig) E.push(t.textContent + ': showed ' + shown[0].id);
    if (t.getAttribute('aria-selected') !== 'true') E.push(t.textContent + ': aria-selected not true');
    if (t.tabIndex !== 0) E.push(t.textContent + ': selected tab not in the tab order');
    const others = tabs.filter((x, n) => n !== i);
    if (others.some(x => x.getAttribute('aria-selected') === 'true')) E.push(t.textContent + ': another tab still selected');
    if (others.some(x => x.tabIndex !== -1)) E.push(t.textContent + ': another tab still tabbable');
  });

  // Arrow keys move along and wrap.
  tabs[0].dispatchEvent(new MouseEvent('click', {bubbles: true}));
  tabs[0].dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowRight', bubbles: true}));
  if (!tabs[1].classList.contains('is-on')) E.push('ArrowRight did not advance');
  tabs[0].dispatchEvent(new MouseEvent('click', {bubbles: true}));
  tabs[0].dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true}));
  if (!tabs[tabs.length - 1].classList.contains('is-on')) E.push('ArrowLeft did not wrap to the end');
  tabs[0].dispatchEvent(new KeyboardEvent('keydown', {key: 'End', bubbles: true}));

  // Each panel must actually contain a signature, not an empty shell.
  panels.forEach(p => {
    if (!p.querySelector('.sig-frame table')) E.push(p.id + ': no signature markup');
    if (/undefined|NaN/.test(p.innerHTML)) E.push(p.id + ': undefined/NaN in markup');
  });

  // The white card must not resize as tabs are pressed. The layouts run from
  // 440x199 to 668x360, so a box that hugged its contents moved the note under
  // it and shifted the rest of the section on every press. Measured on the
  // card itself rather than read off the stylesheet, so a change to padding or
  // to a signature's own width is caught too.
  const boxes = tabs.map(function (t) {
    t.click();
    const r = d.querySelector('.gallery-panel:not([hidden]) .gallery-canvas').getBoundingClientRect();
    return {tab: t.textContent.trim(), w: Math.round(r.width), h: Math.round(r.height)};
  });
  const first = boxes[0];
  boxes.forEach(function (b) {
    if (b.w !== first.w || b.h !== first.h) {
      E.push('the card resizes: ' + first.tab + ' is ' + first.w + 'x' + first.h +
             ' but ' + b.tab + ' is ' + b.w + 'x' + b.h);
    }
  });

  // And nothing may be cut off inside it — a card too small for the widest
  // layout trades a moving card for a signature with its right edge missing.
  //
  // Asked of .sig-frame, because that is the element carrying overflow-x and
  // therefore the one that actually scrolls. Two wrong ways to write this,
  // both of which pass while the thing is visibly scrolling: comparing against
  // the card's clientWidth, which includes the card's padding and so overstates
  // the room available; and measuring the frame's getBoundingClientRect, which
  // returns the shrunk flex box rather than the table overflowing it.
  //
  // Only at this harness's own width — gallery-fit-check.html walks the rest.
  panels.forEach(function (p) {
    const was = p.hidden;
    p.hidden = false;
    const fr = p.querySelector(".sig-frame");
    const x = fr.scrollWidth - fr.clientWidth;
    if (x > 1) E.push(p.id + ": signature scrolls sideways by " + x + "px");
    p.hidden = was;
  });
  tabs[0].click();

  document.getElementById('out').textContent = E.length ? E.join('\n') : 'ok — ' + tabs.length + ' tabs, ' + panels.length + ' panels';
  document.title = E.length ? 'FAIL ' + E.length : 'PASS';
});
</script>
</body></html>
