<!DOCTYPE html><html><head><meta charset="UTF-8"><title>share-check</title></head><body>
<pre id="out"></pre>
<div class="app" id="app" style="position:absolute;left:-4000px"><aside class="rail" id="rail"></aside>
<div class="workspace"><header class="topbar" id="header"></header>
<div class="body" id="appBody"><aside class="panel" id="panel"></aside><main class="stage" id="stage"></main></div></div></div>
<div class="install-overlay hidden" id="shareOverlay"><div class="install-panel is-narrow">
  <div class="install-panel-header"><h2>S</h2><button class="btn" id="shareClose">Close</button></div>
  <div class="install-body">
    <div class="share-row"><input type="text" id="shareUrl" class="share-url" readonly><button class="btn btn-accent" id="shareCopyLink">Copy link</button><a class="btn" id="shareOpen" href="#">Open</a></div>
  </div></div></div>
<div class="install-overlay hidden" id="installOverlay"><div class="install-panel"><div class="install-panel-header"><h2 id="installTitle">I</h2><button class="btn" id="installClose">Cancel</button></div><div class="install-body" id="installBody"></div></div></div>
<div class="export-overlay hidden" id="exportOverlay"><div class="export-panel">
  <div class="export-panel-header"><h2>E</h2><button class="export-close" id="exportClose">x</button></div>
  <div class="export-targets-row"><div class="toggle-group" id="exportTargets"></div><p class="export-note" id="exportNote"></p></div>
  <pre class="export-code"><code id="exportCode"></code></pre>
  <div class="export-actions"><button class="btn btn-accent" id="exportCopyBtn">C</button></div></div></div>
<iframe id="f" style="width:1000px;height:600px;border:1px solid #ccc"></iframe>
<script>window.__err=[];window.addEventListener('error',function(e){window.__err.push(e.message+' @'+(e.filename||'').split('/').pop()+':'+e.lineno)});try{localStorage.clear()}catch(e){}</script>
<script src="../config.js"></script>
<script src="../cloud.js"></script>
<script src="../app.js"></script>
<script>
// A shared link has to open for someone with no account, carry the signature
// rather than a picture of it, and let that person pick their own client.
const out = document.getElementById('out');
const lines = [];
let fails = 0;
function fail(msg) { fails++; lines.push('FAIL ' + msg); }

async function run() {
  // ── The editor end ──
  if (!document.getElementById('shareBtn')) fail('no Share button in the top bar');
  S.name = 'Daniel Reyes'; S.title = 'Head of Partnerships'; S.email = 'daniel@signvel.com';
  S.template = 'corporate'; S.accentColor = '#2B4C7E';

  const url = await buildShareLink();
  const frag = url.split('#')[1] || '';
  if (url.indexOf('share.html#') < 0) fail('the link does not point at the share page');
  if (!/^[zr]:/.test(frag)) fail('the link carries nothing');
  // It must ride in the fragment, which never reaches a server.
  if (url.split('#')[0].indexOf('?') >= 0) fail('part of it is in the query, which the browser does send');
  lines.push('link is ' + url.length.toLocaleString() + ' characters, ' + (frag[0] === 'z' ? 'compressed' : 'uncompressed'));
  if (url.length > 6000) fail('the link is ' + url.length + ' characters, too long to send');

  // The editor's own furniture has no business in it.
  ['openSection', 'panelCollapsed', 'scopeData'].forEach(function (k) {
    if (Object.prototype.hasOwnProperty.call(shareState(), k)) fail('the link carries ' + k + ', which is not the signature');
  });

  showShare();
  await new Promise(r => setTimeout(r, 400));
  if (document.getElementById('shareOverlay').classList.contains('hidden')) fail('Share did not open the dialog');
  const shownUrl = document.getElementById("shareUrl").value;
  if (shownUrl.indexOf("share.html#") < 0) fail("the dialog does not show the link");
  // Open has to point at the same link the field shows.
  if (document.getElementById("shareOpen").getAttribute("href") !== shownUrl) fail("Open points somewhere else than the link");
  // Nothing but the link, the two buttons and the heading.
  if (document.querySelector(".share-lead") || document.getElementById("shareSize")) fail("the dialog still carries explanatory lines");
  document.getElementById('shareOverlay').classList.add('hidden');

  // ── The visitor end ──
  const fr = document.getElementById('f');
  // Each load needs a distinct URL: two addresses differing only after the #
  // do not reload a frame, so onload never fires and the wait never ends.
  let seq = 0;
  const open = (hash) => new Promise(resolve => {
    fr.onload = () => setTimeout(() => resolve(fr.contentWindow), 900);
    fr.src = '../share.html?n=' + (++seq) + hash;
  });

  let w = await open('#' + frag);
  let d = w.document;
  if (!w.__shareReady) fail('the shared page never finished reading the link');
  // No sign-in gate may fire: the visitor has no account.
  if (d.body.classList.contains('app-locked') || /signin/.test(w.location.href)) fail('the shared page tried to make the visitor sign in');
  // The signature, drawn from the settings rather than shipped as markup.
  const sig = d.querySelector('.signature-container');
  if (!sig || !/<table/i.test(sig.innerHTML)) fail('no signature drawn');
  if (sig && sig.textContent.indexOf('Daniel Reyes') < 0) fail('the signature that arrived is not the one shared');
  if ((d.getElementById('shareTitle').textContent || '').indexOf('Daniel Reyes') < 0) fail('the page does not say whose signature it is');

  // ── The client list, behind the Install button as the editor keeps it ──
  const installBtn = d.getElementById("shareInstall");
  if (!installBtn || installBtn.hidden) fail("no Install signature button in the top right");
  // The signature comes first on the page; the list is behind the button.
  const mainKids = [].slice.call(d.querySelector(".share-main").children).map(function (n) { return n.id || n.className; });
  if (mainKids.indexOf("shareBody") < 0) fail("no signature on the page");
  if (d.querySelector(".share-main .install-grid")) fail("the client list is on the page rather than behind the button");
  installBtn.click();
  await new Promise(function (r) { setTimeout(r, 300); });
  const cards = [].slice.call(d.querySelectorAll(".install-card[data-client]"));
  if (cards.length !== previewClients.length) fail("clients offered: " + cards.length + " of " + previewClients.length);
  ["apple", "outlook-new", "outlook-classic", "gmail"].forEach(function (id) {
    if (!d.querySelector('.install-card[data-client="' + id + '"]')) fail('no card for ' + id);
  });
  if (!d.querySelector(".mock-chrome")) fail("the signature is not framed as a client");

  // Picking a client has to change the markup, or the list means nothing.
  const before = d.querySelector(".signature-container").innerHTML;
  d.querySelector('.install-card[data-client="outlook-classic"]').click();
  await new Promise(function (r) { setTimeout(r, 300); });
  const after = d.querySelector(".signature-container").innerHTML;
  if (before === after) fail("picking Outlook classic changed nothing");
  if (/<svg|data:image/i.test(after)) fail("Outlook classic was given markup Word cannot show");
  if (!d.querySelector(".install-steps li")) fail("no steps for the chosen client");
  if ((d.getElementById("installTitle").textContent || "").indexOf("Outlook classic") < 0) fail("the steps do not name the chosen client");
  d.getElementById("installClose").click();

  // ── A hostile link ──
  // Settings come out of a URL, so anyone can put anything in one.
  const nasty = JSON.stringify({
    name: '<img src=x onerror="window.top.__XSS=1">',
    template: {evil: true},           // wrong kind of thing for this key
    notAKey: 'ignored',
    accentColor: '#2B4C7E',
  });
  const bytes = new TextEncoder().encode(nasty);
  let b = ''; bytes.forEach(function (x) { b += String.fromCharCode(x); });
  const payload = btoa(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  window.__XSS = 0;
  w = await open('#r:' + payload);
  d = w.document;
  if (window.__XSS) fail('a hostile link ran something (__XSS=' + window.__XSS + ')');
  if (d.querySelector('.signature-container img[onerror]')) fail('an on-handler reached the page');
  // A key given the wrong kind of value must be left alone, not adopted.
  if (typeof w.__shareState.template !== 'string') fail('a template of the wrong type was adopted');
  if (Object.prototype.hasOwnProperty.call(w.__shareState, 'notAKey')) fail('an unknown key was adopted');

  // ── Links that are wrong rather than hostile ──
  w = await open('');
  if (!w.document.querySelector('.share-empty')) fail('a link with no signature says nothing');
  if (!w.document.getElementById('shareBody').hidden) fail('a link with no signature still shows the editor');
  w = await open('#r:@@@not-base64@@@');
  if (!w.document.querySelector('.share-empty')) fail('a damaged link says nothing');

  lines.push(fails ? '' : 'opens signed out, ' + cards.length + ' clients to choose, each drawing its own markup');
  out.textContent = lines.join('\n');
  document.title = fails ? 'FAIL ' + fails : 'PASS';
}

run().catch(function (e) {
  out.textContent = (window.__err.join('\n') || '') + '\nTHREW: ' + e.message
    + '\n' + (e.stack || '').split('\n').slice(0, 3).join('\n');
  document.title = 'FAIL threw';
});
setTimeout(function () {
  if (!out.textContent.trim()) {
    out.textContent = 'NOTHING RAN\n' + (window.__err || []).join('\n');
    document.title = 'FAIL silent';
  }
}, 25000);
</script></body></html>
