<!DOCTYPE html><html><head><meta charset="UTF-8"><title>share-check</title></head><body>
<pre id="out"></pre>
<script>
// The share link is only worth anything if the page it opens finds the
// signature. The page reads it out of the gallery, so this checks both ends:
// every gallery panel offers a link, and every link names a panel that exists
// with markup in it.
const F = [];
const IDS = ['spotlight','darkcard','colorblock','ribbon','editorial','grid'];
Promise.all([fetch('../index.html').then(r => r.text()), fetch('../share.html').then(r => r.text())])
  .then(([home, share]) => {
    const doc = new DOMParser().parseFromString(home, 'text/html');

    // Every panel carries a share control, pointing at its own signature.
    const panels = [].slice.call(doc.querySelectorAll('.gallery-panel'));
    panels.forEach(p => {
      const id = (p.id || '').replace('panel-', '');
      const btn = p.querySelector('.share-copy');
      const open = p.querySelector('.share-open');
      if (!btn) { F.push(id + ': no share button'); return; }
      if (btn.dataset.share !== id) F.push(id + ': share button points at ' + btn.dataset.share);
      if (!open || open.getAttribute('href').indexOf('t=' + id) < 0)
        F.push(id + ': the open link does not point at its own signature');
      // The thing being shared has to be in the panel to be read back.
      const frame = p.querySelector('.sig-frame');
      if (!frame || frame.innerHTML.trim().length < 200) F.push(id + ': no signature markup in the panel');
      if (frame && !/<table/i.test(frame.innerHTML)) F.push(id + ': the panel holds no table');
    });
    if (panels.length !== IDS.length) F.push('panels: ' + panels.length + ' vs ' + IDS.length + ' expected');

    // The share page knows the same names, or a good link lands on an error.
    IDS.forEach(id => {
      if (!doc.querySelector('#panel-' + id)) F.push('no gallery panel for ' + id);
      if (share.indexOf(id + ':') < 0) F.push(id + ': the share page does not know this name');
    });
    // And it reads them from the gallery rather than keeping its own copy.
    if (share.indexOf('loadHome') < 0) F.push('the share page does not read the gallery');
    if (/<table[^>]*role="presentation"/i.test(share)) F.push('the share page keeps its own copy of a signature');
    // Nothing on it may need an account.
    if (/cloud\.js|supabase/i.test(share)) F.push('the share page pulls in the cloud layer');

    // Appended, not assigned: the view block below writes to the same place
    // and whichever finished last was wiping the other one out.
    const o = document.getElementById('out');
    o.textContent = (F.length ? F.join('\n')
      : 'ok — ' + panels.length + ' signatures, each with a share link the page can resolve')
      + (o.textContent ? '\n' + o.textContent : '');
    document.title = F.length ? 'FAIL ' + F.length : 'PASS';
  })
  .catch(e => {
    document.getElementById('out').textContent = 'THREW: ' + e.message;
    document.title = 'FAIL threw';
  });
</script>
<iframe id="f" style="width:900px;height:500px;border:1px solid #ccc"></iframe>
<script>
// The other half: open each link the way a visitor does and confirm a
// signature actually lands in the page. Reading the markup is not enough —
// the first version passed every markup check while the page it opened
// showed nothing at all, because it could not find the gallery.
window.__viewStarted = true;
const IDS2 = ["spotlight","darkcard","colorblock","ribbon","editorial","grid"];
const V = [];
const fr = document.getElementById("f");
let k = 0;
function nextView() {
  if (k >= IDS2.length) {
    const out = document.getElementById("out");
    out.textContent += "\n" + (V.length ? "VIEW FAIL:\n" + V.join("\n")
      : IDS2.length + " links open and render their signature");
    window.__viewRan = true;
    if (V.length) document.title = "FAIL view " + V.length;
    return;
  }
  const id = IDS2[k++];
  fr.onload = function () { setTimeout(function () {
    const d = fr.contentDocument;
    const canvas = d.getElementById("shareCanvas");
    if (!canvas) { V.push(id + ": no canvas"); return nextView(); }
    if (!/<table/i.test(canvas.innerHTML)) V.push(id + ": nothing rendered");
    if (canvas.innerHTML.length < 400) V.push(id + ": only " + canvas.innerHTML.length + " chars");
    if (d.querySelector(".share-actions").hidden) V.push(id + ": copy buttons hidden");
    nextView();
  }, 400); };
  fr.src = "../share.html?t=" + id;
}
nextView();
</script></body></html>
<script>
// A block that fails to parse never runs and leaves the title from the block
// before it, so a broken check reads as a pass. This one has already caught
// itself once: the view block was a syntax error and reported nothing.
setTimeout(function () {
  if (!window.__viewRan) {
    document.getElementById('out').textContent += '\nTHE VIEW CHECK NEVER FINISHED';
    document.title = 'FAIL dead-block';
  }
}, 8000);
</script>
