<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>nav</title></head>
<body>
<!--
  Signvel — the signed-in-only navigation

  templates.html is behind sign-in, so the showcase links ship hidden and
  nav.js reveals them when a Supabase session key is present. Two ways that
  goes wrong silently, and both are checked here:

   * A link that forgets data-auth-only or hidden, and is therefore offered to
     every signed-out visitor — the thing this was built to stop.

   * The attribute losing to a class. [hidden] is a user-agent rule, and
     .btn-secondary sets display:inline-flex, so the "Browse templates" button
     stayed on screen while reporting itself hidden. site.css now carries a
     !important override and this asserts it is still there.

  nav.js is driven directly rather than through a frame: localStorage under
  file:// is not somewhere to build a test on.
-->
  <div id="stage"></div>
  <pre id="report" style="font:12px monospace;white-space:pre-wrap"></pre>

<script>
const E = [];
window.onerror = (m, s, l, c) => { E.push('JS: ' + m + ' @' + l + ':' + c); };

const PAGES = ['help.html','install.html','pricing.html','signin.html','signup.html','templates.html'];
const KEY = 'sb-testproject-auth-token';

function loadNav() {
  return new Promise(function (res) {
    const s = document.createElement('script');
    s.src = '../nav.js?' + Math.random();
    s.onload = function () { setTimeout(res, 0); };
    document.body.appendChild(s);
  });
}

function mount() {
  document.getElementById('stage').innerHTML =
    '<a id="l1" href="templates.html" data-auth-only hidden>Showcase</a>' +
    '<a id="l2" class="btn-secondary" href="templates.html" data-auth-only hidden>Browse templates</a>' +
    '<a id="l3" href="pricing.html">Pricing</a>';
}
const hidden = id => document.getElementById(id).hidden;

async function run() {
  // ── 1. The markup ──
  for (const file of PAGES) {
    let src;
    try { src = await (await fetch('../' + file)).text(); }
    catch (e) { E.push('could not read ' + file + ': ' + e.message); continue; }

    const links = src.match(/<a[^>]*href="templates\.html"[^>]*>/g) || [];
    if (!links.length) E.push(file + ': no showcase link found at all');
    links.forEach(function (tag) {
      if (tag.indexOf('data-auth-only') === -1) E.push(file + ': a templates link is not marked data-auth-only — ' + tag);
      if (!/\shidden(\s|>)/.test(tag)) E.push(file + ': a templates link does not ship hidden — ' + tag);
    });
    if (src.indexOf('src="nav.js"') === -1) E.push(file + ': marks links data-auth-only but never loads nav.js');
  }

  // ── 2. The attribute has to beat the class ──
  try {
    const css = await (await fetch('../site.css')).text();
    if (!/\[hidden\]\s*\{\s*display:\s*none\s*!important/.test(css)) {
      E.push('site.css has no [hidden] override — .btn-secondary will out-specify it and show anyway');
    }
  } catch (e) { E.push('could not read site.css: ' + e.message); }

  // ── 3. Signed out: nothing is revealed ──
  let storage = true;
  try { localStorage.removeItem(KEY); } catch (e) { storage = false; }
  if (!storage) { E.push('localStorage unavailable, cannot test the reveal'); return done(); }

  mount();
  await loadNav();
  if (!hidden('l1')) E.push('signed out: the showcase nav link was revealed');
  if (!hidden('l2')) E.push('signed out: the browse-templates button was revealed');

  // ── 4. Signed in: they come back ──
  localStorage.setItem(KEY, JSON.stringify({access_token:'x'}));
  mount();
  await loadNav();
  if (hidden('l1')) E.push('signed in: the showcase nav link stayed hidden');
  if (hidden('l2')) E.push('signed in: the browse-templates button stayed hidden');
  if (document.getElementById('l3').hidden) E.push('signed in: an unmarked link was hidden by mistake');

  // ── 5. An unrelated key must not count as a session ──
  localStorage.removeItem(KEY);
  localStorage.setItem('sb-something-else', '1');
  localStorage.setItem('theme', 'dark');
  mount();
  await loadNav();
  if (!hidden('l1')) E.push('a non-session localStorage key was taken for a session');
  localStorage.removeItem('sb-something-else');
  localStorage.removeItem('theme');

  done();
}

function done() {
  document.getElementById('report').textContent = E.length ? E.join('\n') : 'ok';
  document.title = E.length ? 'FAIL ' + E.length : 'PASS';
}

run();
</script>
</body>
</html>
