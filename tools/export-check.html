<!DOCTYPE html><html><head><meta charset="UTF-8"><title>export-check</title></head>
<body>
  <div class="app" id="app"><aside class="rail" id="rail"></aside>
  <div class="workspace"><header class="topbar" id="header"></header>
  <div class="body" id="appBody"><aside class="panel" id="panel"></aside><main class="stage" id="stage"></main></div></div></div>
  <div class="install-overlay hidden" id="installOverlay"><div class="install-panel"><div class="install-panel-header"><h2 id="installTitle">I</h2><button class="btn" id="installClose">Cancel</button></div><div class="install-body" id="installBody"></div></div></div>
  <div class="export-overlay hidden" id="exportOverlay"><div class="export-panel">
    <div class="export-panel-header"><h2>E</h2><button class="export-close" id="exportClose">x</button></div>
    <div class="export-targets-row"><div class="toggle-group" id="exportTargets"></div><p class="export-note" id="exportNote"></p></div>
    <pre class="export-code"><code id="exportCode"></code></pre>
    <div class="export-actions"><button class="btn btn-accent" id="exportCopyBtn">C</button></div></div></div>
  <link rel="stylesheet" href="../styles.css"><pre id="out" style="position:fixed;left:0;bottom:0;z-index:99;background:#fff"></pre>
  <script>try { localStorage.clear(); } catch (e) {}</script>
  <script src="../config.js"></script>
  <script src="../cloud.js"></script>
  <script src="../app.js"></script>
  <script>
  const E = [];
  // Every layout, every icon treatment, both Outlook variants.
  const MODES = ['circle','filled','icons','letters','labels'];
  const SOCIAL = ['circle','filled','chip','plain','outline'];
  Object.keys(templateThemes).forEach(t => {
    S.template = t;
    MODES.forEach(m => {
      S.contactIconMode = m;
      SOCIAL.forEach(s => {
        S.socialStyle = s;
        ['newoutlook','classic'].forEach(target => {
          const h = generateExportHTML(target);
          // Neither Outlook renders these, so neither may appear.
          if (/<svg/i.test(h))        E.push(t+'/'+m+'/'+s+'/'+target+': contains <svg>');
          if (/data:image/i.test(h))  E.push(t+'/'+m+'/'+s+'/'+target+': contains a data: image');
          // Every icon carries the theme colour, on itself or on its ground.
          // An ink glyph is black whatever is behind it, so none may appear.
          if (/-ink\.png/.test(h))    E.push(t+'/'+m+'/'+s+'/'+target+': an ink glyph');
          
          // Word ignores a radius, so nothing classic actually renders may ask
          // for one. What sits in an <!--[if !mso]> block is invisible to it.
          if (target === 'classic') {
            const seen = h.replace(/<!--\[if !mso\]><!-->[\s\S]*?<!--<!\[endif\]-->/g, '');
            if (/border-radius:50%/.test(seen))
              E.push(t+'/'+m+'/'+s+'/classic: a round badge classic can see');
          }
        });
      });
    });
  });
  // Clean is not enough: a variant that dropped the glyph and put nothing back
  // would also pass every check above. The mark has to be there to be read.
  S.template='corporate'; S.socialStyle='circle';
  S.email='a@b.com'; S.phone='+971 4 000 0000'; S.website='b.com';
  ['circle','filled'].forEach(m => {
    S.contactIconMode = m;
    const n = generateExportHTML('newoutlook');
    // New Outlook keeps the drawing, served over https rather than inlined.
    ['c-email', 'c-phone', 'c-website'].forEach(f => {
      if (n.indexOf('https://signvel.com/icons/' + f + '-') < 0) E.push('newoutlook/' + m + ': no hosted ' + f);
    });
    if (!/border-radius:50%/.test(n)) E.push('newoutlook/' + m + ': lost its round badges');
    // Every badge is filled for New Outlook, so every badged glyph is white:
    // an ink glyph in there would be the black-in-a-blue-ring fault again.
    if (n.indexOf('c-email-white.png') < 0) E.push('newoutlook/' + m + ': badge glyph is not white');
    if (n.indexOf('-ink.png') >= 0) E.push('newoutlook/' + m + ': an ink glyph is still inside a badge');
    // The badge itself must carry the theme colour, which is what makes the
    // fill worth having — a grey disc would be no better than a black glyph.
    if (n.indexOf('bgcolor="' + S.accentColor + '"') < 0 && n.toLowerCase().indexOf('bgcolor="' + S.accentColor.toLowerCase() + '"') < 0)
      E.push('newoutlook/' + m + ': the filled badge is not the theme colour');
    const c = generateExportHTML('classic');
    ['E.','T.','W.'].forEach(L => {
      if (c.indexOf('>' + L + '<') < 0) E.push('classic/' + m + ': no ' + L + ' lead');
    });
  });

  // The standard variant must be untouched, and the preview must not be left
  // on a client's variant afterwards.
  S.template='corporate'; S.contactIconMode='circle'; S.socialStyle='circle';
  if (!/<svg|data:image/i.test(generateExportHTML('')))   E.push('standard export lost its glyphs');
  generateExportHTML('classic');
  if (EXPORT_TARGET !== null) E.push('EXPORT_TARGET left set after an export');
  if (!/<svg|data:image/i.test(generateSignaturePreview())) E.push('the live preview was left on a variant');
  // The dialog exports for the client being previewed and offers no choice of
  // its own — a second picker there could disagree with the tab.
  S.client = 'apple';
  showExport();
  if (document.querySelectorAll('#exportTargets button[data-target]').length)
    E.push('the dialog still offers a target picker');
  const code = document.getElementById('exportCode');
  const forLabel = () => (document.querySelector('.export-for') || {}).textContent || '';
  if (forLabel().indexOf('Apple Mail') < 0) E.push('the dialog does not name the client: ' + forLabel());
  if (!/<svg|data:image/i.test(code.textContent)) E.push('Apple Mail did not get the Standard markup');
  const standard = code.textContent;
  const note = document.getElementById('exportNote').textContent;

  // The client tab is the target now: three Outlook tabs, each writing the
  // signature differently, and every other client on Standard.
  // Picking a card replaces the grid with that client's steps, so the grid is
  // reopened for each pick rather than assuming the cards are still there.
  const pick = id => {
    showInstall();
    const card = document.querySelector('.install-card[data-client="' + id + '"]');
    if (!card) { E.push('no card for ' + id); return false; }
    card.click();
    return true;
  };
  const shown = () => document.querySelector('.signature-container').innerHTML;
  showInstall(); const tabIds = [].map.call(document.querySelectorAll('.install-card'), b => b.dataset.client);
  ['outlook-new', 'outlook-classic', 'outlook'].forEach(id => {
    if (tabIds.indexOf(id) < 0) E.push('no ' + id + ' tab');
  });
  if (!/<svg|data:image/i.test(shown())) E.push('the preview did not start on Standard');

  pick('outlook-classic');
  if (currentTarget() !== 'classic') E.push('the Classic Outlook tab did not set the target');
  if (S.client !== 'outlook-classic') E.push('picking the card did not select the client');
  // The whole point of splitting the tab: the preview has to change with it.
  if (/<svg|data:image/i.test(shown())) E.push('the preview did not redraw for Classic Outlook');
  // The dialog is open, so it has to follow the tab — in what it says and in
  // the code it hands over.
  if (forLabel().indexOf('classic') < 0) E.push('the open dialog still names the old client: ' + forLabel());
  if (/<svg|data:image/i.test(code.textContent)) E.push('the open dialog kept the Standard markup');
  if (document.getElementById('exportNote').textContent === note) E.push('the note did not follow the tab');
  // What the copy button would put on the clipboard, by the same route it takes.
  if (/<svg|data:image/i.test(withExportTarget(currentTarget(), generateSignaturePreview)))
    E.push('Copy signature ignored the chosen tab');

  pick('outlook-new');
  if (currentTarget() !== 'newoutlook') E.push('the New Outlook tab did not set the target');
  if (/<svg|data:image/i.test(shown())) E.push('the preview did not redraw for New Outlook');
  if (!/border-radius:50%/.test(shown())) E.push('New Outlook lost its round badges in the preview');

  // Standard Outlook, and every client that is not Outlook, gets the ordinary
  // markup back — the target must not stick once the tab moves off Outlook.
  pick('outlook');
  if (currentTarget() !== '') E.push('Standard Outlook did not go back to Standard');
  if (!/<svg|data:image/i.test(shown())) E.push('Standard Outlook is still drawing a variant');
  pick('outlook-classic');
  pick('gmail');
  if (currentTarget() !== '') E.push('the target stuck after moving to Gmail');
  if (!/<svg|data:image/i.test(shown())) E.push('Gmail is still drawing a variant');

  // Back on a plain client, the dialog says so and hands back Standard.
  if (forLabel().indexOf('Gmail') < 0) E.push('the dialog did not follow back to Gmail: ' + forLabel());
  if (code.textContent !== standard) E.push('Gmail did not give the same Standard markup as Apple Mail');
  if (EXPORT_TARGET !== null) E.push('the preview bar left EXPORT_TARGET set');
  document.getElementById('out').textContent = E.length ? E.slice(0,12).join('\n') + '\n\n(' + E.length + ' total)' : 'ok — 24 layouts x 25 combinations, both variants clean';
  window.__mainRan = true;
  document.title = E.length ? 'FAIL ' + E.length : 'PASS';
  </script>

<script>
// The picker has to be legible in the dark dialog: on screen, big enough to
// hit, and not text the same colour as what is behind it.
(function () {
  const F = [];
  // A throw in here used to take the whole report with it, silently, leaving a
  // PASS that had checked nothing. It is caught and reported now.
  try {
  const row = document.querySelector('.export-targets-row');
  // The dialog carries a label rather than a picker now: on screen, and not
  // the same colour as what it sits on.
  const bs = [];
  const tag = document.querySelector('.export-for');
  if (!tag) F.push('the dialog does not say which client it is for');
  else {
    const r = tag.getBoundingClientRect(), cs = getComputedStyle(tag);
    if (r.width < 40 || r.height < 14) F.push('the client label is ' + Math.round(r.width) + 'x' + Math.round(r.height));
    if (cs.color === cs.backgroundColor) F.push('the client label is the colour of its own ground');
  }
  // The cards in the picker, which has to be open to have any geometry.
  showInstall();
  const hb = [].slice.call(document.querySelectorAll('.install-card')).filter(function (b) { return /outlook/.test(b.dataset.client); });
  if (hb.length !== 3) F.push('Outlook cards: ' + hb.length);
  [].slice.call(document.querySelectorAll('.install-card')).forEach(function (b) {
    const r = b.getBoundingClientRect();
    // A card has to be big enough to hit and to read its logo and name.
    if (r.width < 120 || r.height < 40) F.push('card ' + b.textContent.trim() + ': ' + Math.round(r.width) + 'x' + Math.round(r.height));
    const logo = b.querySelector('.install-card-logo svg');
    if (logo && logo.getBoundingClientRect().width < 14) F.push('card ' + b.textContent.trim() + ': logo too small');
  });
  // Whether they wrap depends on the window, which this one is far too narrow
  // to judge. What must hold at any width is that the three are adjacent, so
  // they read as one client split three ways rather than scattered.
  const order = [].map.call(document.querySelectorAll('.install-card'), b => b.dataset.client);
  const at = order.map((id, i) => /outlook/.test(id) ? i : -1).filter(i => i >= 0);
  if (at.length === 3 && (at[1] !== at[0] + 1 || at[2] !== at[1] + 1))
    F.push('the Outlook cards are not adjacent: ' + order.join(' '));
  const note = document.getElementById('exportNote').getBoundingClientRect();
  if (note.height < 10) F.push('the note is not on screen');
  // The three sit on one line rather than stacking.
  // (the dialog has no picker to wrap any more)
  const out = document.getElementById('out');
  const dims = l => l.map(b => Math.round(b.getBoundingClientRect().width) + 'x' + Math.round(b.getBoundingClientRect().height)).join(' ');
  const summary = 'dialog: names the client, no picker\nOutlook tabs:  ' + dims(hb) + ', adjacent';
  // The headless window is far narrower than any real editor, so measuring the
  // row as it falls here says nothing. Widen the bar and find the width at
  // which the clients, the targets and the device toggle share one row.
  // The bar is two declared rows now, not one left to wrap. Each row's natural
  // width is added up — every group end to end plus the gaps and the bar's own
  // padding — to give the stage width each needs before it wraps again.
  const barEl = document.querySelector('.stage-toolbar');
  const pad = parseFloat(getComputedStyle(barEl).paddingLeft) + parseFloat(getComputedStyle(barEl).paddingRight);
  // Measured boxes are whatever this narrow window squeezed them to, so the
  // width is summed from the leaves up instead: the buttons themselves do not
  // shrink, and their total is the width the row needs wherever it is shown.
  const natural = el => {
    const kids = [].slice.call(el.children);
    if (!kids.length) return el.getBoundingClientRect().width;
    const g = parseFloat(getComputedStyle(el).gap) || 0;
    return kids.reduce((n, k) => n + natural(k), 0) + g * Math.max(0, kids.length - 1);
  };
  const barRows = [].slice.call(barEl.querySelectorAll('.stage-toolbar-row'));
  if (barRows.length !== 2) F.push('the bar is ' + barRows.length + ' declared rows, not 2');
  // Two rows has to mean two: stacked, whatever the width. Whether a row wraps
  // internally on a narrow window is the bar's own behaviour and not a fault.
  if (barRows.length === 2 && Math.round(barRows[0].getBoundingClientRect().top) === Math.round(barRows[1].getBoundingClientRect().top))
    F.push('the two rows landed on the same line');
  const needs = barRows.length === 2 ? barRows.map(r => Math.round(natural(r) + pad)) : [];
  // Printed last, so a fault found anywhere above actually reaches the report.
  out.textContent += '\n' + (F.length ? 'STYLE FAIL:\n' + F.join('\n')
    : summary + '\ntwo declared rows, stacked — row 1 needs ' + needs[0] + 'px of stage, row 2 needs ' + needs[1] + 'px');
  if (F.length) document.title = 'FAIL style ' + F.length;
  window.__styleRan = true;
  } catch (err) {
    document.getElementById('out').textContent += '\nSTYLE CHECK THREW: ' + err.message;
    document.title = 'FAIL style threw';
  }
})();
</script>
<script>
// Every hosted glyph the New Outlook variant asks for must exist as a file,
// or the recipient gets a broken image where the icon should be. Checked by
// loading each one, not by trusting the name.
(function () {
  const urls = new Set();
  const MODES = ['circle','filled','icons','letters','labels'];
  const SOCIAL = ['circle','filled','chip','plain','outline'];
  Object.keys(templateThemes).forEach(t => {
    S.template = t;
    MODES.forEach(m => { S.contactIconMode = m;
      SOCIAL.forEach(s => { S.socialStyle = s;
        const h = generateExportHTML('newoutlook');
        (h.match(/https:\/\/signvel\.com\/icons\/[a-z0-9-]+\.png/g) || []).forEach(u => urls.add(u));
      });
    });
  });
  const out = document.getElementById('out');
  const list = Array.from(urls); // a Set has no length, so [].slice.call would give []
  if (!list.length) { out.textContent += '\nNO HOSTED ICONS REFERENCED'; document.title = 'FAIL icons 0'; return; }
  let done = 0; const missing = [], blank = [], spans = [], offcentre = [];
  list.forEach(u => {
    const img = new Image();
    // Loaded from the local file the URL maps to, since the harness runs offline.
    const local = '../icons/' + u.split('/').pop();
    // A valid PNG can still be blank, which would look exactly like success
    // in every other check here, so the pixels are counted.
    img.onload  = () => {
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const d = ctx.getImageData(0, 0, c.width, c.height).data;
      let lit = 0;
      for (let i = 3; i < d.length; i += 4) if (d[i] > 8) lit++;
      const pct = lit / (c.width * c.height);
      if (pct < 0.02) blank.push(u.split('/').pop() + ' ' + Math.round(pct * 100) + '%');
      // Every glyph has to fill the same share of its canvas and sit in the
      // middle of it, or one reads as too big for its badge and another as
      // adrift in the same ring.
      const box = inkBounds(ctx, c.width, c.height);
      if (box) {
        spans.push(Math.max(box.w, box.h));
        const off = Math.max(Math.abs((box.x + box.w / 2) - c.width / 2), Math.abs((box.y + box.h / 2) - c.height / 2));
        if (off > 1) offcentre.push(u.split('/').pop() + ' by ' + off.toFixed(1) + 'px');
      }
      if (++done === list.length) report();
    };
    img.onerror = () => { missing.push(u.split('/').pop()); if (++done === list.length) report(); };
    img.src = local;
  });
  function report() {
    const spread = spans.length ? Math.max.apply(null, spans) - Math.min.apply(null, spans) : 0;
    const uneven = spread > 3;
    out.textContent += missing.length ? '\nMISSING ICON FILES: ' + missing.join(', ')
      : blank.length ? '\nBLANK ICON FILES: ' + blank.join(', ')
      : uneven ? '\nICON SIZES UNEVEN: ink spans ' + Math.min.apply(null, spans) + '-' + Math.max.apply(null, spans) + ' of 72'
      : offcentre.length ? '\nICONS OFF CENTRE: ' + offcentre.join(', ')
      : '\n' + list.length + ' hosted glyphs referenced, present and drawn, ink '
        + Math.min.apply(null, spans) + '-' + Math.max.apply(null, spans) + ' of 72, all centred';
    if (missing.length || blank.length || uneven || offcentre.length)
      document.title = 'FAIL icons ' + (missing.length + blank.length + offcentre.length + (uneven ? 1 : 0));
  }
})();
</script>
<script>
// The fault the tab split introduced: the target lived alongside S.client
// instead of being derived from it, so a reload restored the tab with the
// preview, the copy and the export all still on Standard.
(function () {
  const F = [];
  S.client = 'outlook-new';
  if (currentTarget() !== 'newoutlook') F.push('a restored New Outlook tab does not give its target');
  renderStage();
  const shown = document.querySelector('.signature-container').innerHTML;
  if (/<svg|data:image/i.test(shown)) F.push('a restored tab renders the preview as Standard');
  if (document.querySelector('.stage-target-note').textContent.indexOf('Standard') === 0)
    F.push('a restored tab shows the Standard note');
  S.client = 'gmail';
  if (currentTarget() !== '') F.push('Gmail does not give Standard');
  renderStage();
  const out = document.getElementById('out');
  out.textContent += '\n' + (F.length ? 'RELOAD FAIL:\n' + F.join('\n') : 'a restored tab carries its target into the preview');
  if (F.length) document.title = 'FAIL reload ' + F.length;
})();
</script>
<script>
// The exactly-coloured glyphs: uploaded per account, so the harness stands in
// for the upload and checks what the markup does with the result.
(function () {
  const F = [];
  S.template = 'corporate'; S.socialStyle = 'circle';
  // Keyed on the colour the renderer resolves, not the accent: a layout can
  // override the icon colour, and the key has to follow what is drawn.
  S.accentColor = '#2B4C7E'; S.iconColor = '#2B4C7E'; S.socialIconColor = '#2B4C7E';
  S.iconAssets = {};

  // Without a set, the badge fills so the colour is at least in the ground.
  S.contactIconMode = 'circle';
  let h = generateExportHTML('newoutlook');
  if (h.indexOf('c-email-white.png') < 0) F.push('no set: the badge did not fall back to filled white');

  // With one, the ring stays open and the glyph carries the colour.
  const url = 'https://example.test/icon/email-2b4c7e.png';
  S.iconAssets[iconAssetKey('email', S.iconColor)] = url;
  h = generateExportHTML('newoutlook');
  if (h.indexOf(url) < 0) F.push('the uploaded glyph was not used');
  if (h.indexOf('c-email-white.png') >= 0) F.push('the badge is still filled white with a set available');
  if (h.indexOf('-ink.png') >= 0) F.push('an ink glyph survived alongside the set');

  // The bare treatment is the other half of the report: it was black.
  S.contactIconMode = 'icons';
  h = generateExportHTML('newoutlook');
  if (h.indexOf(url) < 0) F.push('the bare glyph did not use the uploaded colour');
  if (h.indexOf('-ink.png') >= 0) F.push('the bare glyph is still ink');

  // A colour change must not reuse the old file.
  S.accentColor = '#B4121F'; S.iconColor = '#B4121F'; S.socialIconColor = '#B4121F';
  h = generateExportHTML('newoutlook');
  if (h.indexOf(url) >= 0) F.push('a new colour reused the old glyph');

  // Nothing here may reach a client as an embedded image, which is the whole
  // reason the files exist.
  if (/data:image|<svg/i.test(h)) F.push('the variant fell back to something New Outlook strips');

  S.accentColor = '#2B4C7E'; S.iconColor = ''; S.socialIconColor = ''; S.contactIconMode = 'circle'; S.iconAssets = {};
  const out = document.getElementById('out');
  out.textContent += '\n' + (F.length ? 'COLOUR FAIL:\n' + F.join('\n')
    : 'exact-colour glyphs: used when present, filled-white fallback when not');
  if (F.length) document.title = 'FAIL colour ' + F.length;
})();
</script>
<script>
// Classic Outlook draws through Word: it keeps an image and discards a
// border-radius, so a badge only survives as a picture with the circle in it.
(function () {
  const F = [];
  S.template = 'corporate'; S.bgEnabled = false;
  S.accentColor = '#2B4C7E'; S.iconColor = '#2B4C7E'; S.socialIconColor = '#2B4C7E';
  S.contactIconMode = 'circle'; S.socialStyle = 'circle'; S.iconAssets = {};

  // With no set, it must fall back to something Word can draw — letters and
  // text links — rather than asking for a circle it will square off.
  let h = generateExportHTML('classic');
  const visible = h.replace(/<!--\[if !mso\]><!-->[\s\S]*?<!--<!\[endif\]-->/g, '');
  if (/border-radius:50%/.test(visible)) F.push('no set: classic still asks for a round badge');
  if (h.indexOf('>E.<') < 0) F.push('no set: no letter fallback');

  // With one, the badge is a picture and the letters are gone.
  const px = S.contactIconSize || 22;
  const ground = badgeGround();
  const bUrl = 'https://example.test/badge-email.png';
  S.iconAssets[badgeAssetKey('email', S.iconColor, false, px, ground)] = bUrl;
  h = generateExportHTML('classic');
  if (h.indexOf(bUrl) < 0) F.push('the baked badge was not used');
  if (h.indexOf('>E.<') >= 0) F.push('the letter survived alongside the badge');
  if (h.indexOf('width="' + px + '"') < 0) F.push('the badge is not drawn at its own size');

  // A filled badge, a different size and a different ground are all different
  // pictures — reusing one would show the wrong drawing.
  if (badgeAssetKey('email', S.iconColor, true, px, ground) === badgeAssetKey('email', S.iconColor, false, px, ground))
    F.push('filled and open share a key');
  if (badgeAssetKey('email', S.iconColor, false, px + 2, ground) === badgeAssetKey('email', S.iconColor, false, px, ground))
    F.push('two sizes share a key');
  if (badgeAssetKey('email', S.iconColor, false, px, '#101010') === badgeAssetKey('email', S.iconColor, false, px, ground))
    F.push('two grounds share a key');

  // Whatever it falls back to, classic may never carry what Word cannot show.
  ['circle', 'filled', 'icons', 'letters'].forEach(m => {
    S.contactIconMode = m;
    ['circle', 'filled', 'glyph', 'plain', 'chip'].forEach(s => {
      S.socialStyle = s;
      const c = generateExportHTML('classic');
      if (/<svg|data:image/i.test(c)) F.push('classic/' + m + '/' + s + ': carries something Word cannot show');
      const vis = c.replace(/<!--\[if !mso\]><!-->[\s\S]*?<!--<!\[endif\]-->/g, '');
      if (/border-radius:50%/.test(vis)) F.push('classic/' + m + '/' + s + ': a round badge Word will square');
    });
  });

  S.contactIconMode = 'circle'; S.socialStyle = 'circle'; S.iconAssets = {};
  S.iconColor = ''; S.socialIconColor = '';
  const out = document.getElementById('out');
  out.textContent += '\n' + (F.length ? 'CLASSIC FAIL:\n' + F.join('\n')
    : 'classic: baked badges used when present, letters and text when not');
  if (F.length) document.title = 'FAIL classic ' + F.length;
})();
</script>
<script>
// The client list is a compatibility claim, so each tab has to be real: a
// logo, a name, and the right markup behind it.
(function () {
  const F = [];
  showInstall();
  const tabs = [].slice.call(document.querySelectorAll('.install-card'));
  if (tabs.length !== previewClients.length) F.push('tabs drawn ' + tabs.length + ' vs listed ' + previewClients.length);
  previewClients.forEach(c => {
    const el = document.querySelector('.install-card[data-client="' + c.id + '"]');
    if (!el) { F.push('no tab for ' + c.id); return; }
    if (!el.querySelector('svg')) F.push(c.id + ': no logo drawn');
    if (!el.textContent.trim()) F.push(c.id + ': no name');
  });
  // "Has a logo" was not enough: five clients shared one grey envelope and
  // passed. A mark may only be shared where the product is the same one —
  // Gmail twice, Apple twice, Outlook three times — never beyond that.
  const byLogo = {};
  previewClients.forEach(c => {
    const k = c.logo || c.id;
    (byLogo[k] = byLogo[k] || []).push(c.id);
  });
  Object.keys(byLogo).forEach(k => {
    if (byLogo[k].length > 3) F.push('one mark for ' + byLogo[k].length + ' clients: ' + byLogo[k].join(', '));
  });
  const distinct = Object.keys(byLogo).length;
  if (distinct < 10) F.push('only ' + distinct + ' distinct marks across ' + previewClients.length + ' clients');
  // Every mark named has to exist, or the tab draws nothing at all.
  previewClients.forEach(c => {
    if (!mailLogos[c.logo || c.id]) F.push(c.id + ': names a mark that does not exist (' + (c.logo || c.id) + ')');
  });
  // Exactly three carry markup of their own; every other client renders the
  // Standard form, and claiming otherwise would be the bug.
  const withTarget = previewClients.filter(c => c.target);
  if (withTarget.map(c => c.target).sort().join(',') !== 'classic,newoutlook')
    F.push('targets carried: ' + withTarget.map(c => c.id + '=' + c.target).join(' '));
  previewClients.filter(c => !c.target).forEach(c => {
    S.client = c.id;
    if (currentTarget() !== '') F.push(c.id + ' does not render Standard');
  });
  // A tab saved before the list changed must not leave the bar unmarked.
  S.client = 'a-client-that-no-longer-exists';
  renderStage(); showInstall();
  if (!document.querySelector('.install-card.current')) F.push('a stale saved client leaves none marked in the picker');
  S.client = 'gmail'; renderStage();
  const out = document.getElementById('out');
  out.textContent += '\n' + (F.length ? 'CLIENTS FAIL:\n' + F.join('\n')
    : previewClients.length + ' clients, ' + distinct + ' distinct marks, ' + withTarget.length + ' with markup of their own');
  if (F.length) document.title = 'FAIL clients ' + F.length;
})();
</script>
<script>
// The install button is the only way to the client list now, so the button,
// the picker and the steps all have to work — and picking has to set the
// target, which is what the tabs used to do.
(function () {
  const F = [];
  document.getElementById('installOverlay').classList.add('hidden');
  S.client = 'gmail'; renderStage();
  const btn = document.getElementById('installBtn');
  if (!btn) F.push('no Install signature button on the stage');
  if (document.querySelectorAll('#clientTabs .client-tab').length) F.push('the old client tabs are still on the stage');
  // The stage says which client it is drawing for, since the tabs no longer do.
  const said = (document.querySelector('.stage-client') || {}).textContent || '';
  if (said.indexOf('Gmail') < 0) F.push('the stage does not name the client: ' + said);

  if (btn) btn.click();
  const overlay = document.getElementById('installOverlay');
  if (overlay.classList.contains('hidden')) F.push('the button did not open the picker');

  // Picking Outlook classic has to carry through to the markup.
  const card = document.querySelector('.install-card[data-client="outlook-classic"]');
  if (!card) F.push('no card for outlook-classic');
  else {
    card.click();
    if (currentTarget() !== 'classic') F.push('picking a client did not set the target');
    if (/<svg|data:image/i.test(withExportTarget(currentTarget(), generateSignaturePreview)))
      F.push('the copy did not follow the picked client');
    // And the steps for it should be on screen, not the grid.
    const steps = document.querySelectorAll('.install-steps li');
    if (!steps.length) F.push('no steps shown after picking');
    if (document.querySelectorAll('.install-card').length) F.push('still showing the grid after picking');
    if ((document.getElementById('installTitle').textContent || '').indexOf('Outlook classic') < 0)
      F.push('the steps do not name the client');
    // Back returns to the grid.
    const back = document.getElementById('installBack');
    if (!back) F.push('no way back to the list');
    else { back.click(); if (!document.querySelectorAll('.install-card').length) F.push('back did not return to the grid'); }
  }
  // A client with no steps of its own still gets something to follow.
  const generic = previewClients.find(c => !c.install);
  if (generic) {
    showInstall(generic.id);
    if (!document.querySelectorAll('.install-steps li').length)
      F.push(generic.id + ': no steps at all');
  }
  document.getElementById('installOverlay').classList.add('hidden');
  S.client = 'gmail'; renderStage();
  const out = document.getElementById('out');
  out.textContent += '\n' + (F.length ? 'INSTALL FAIL:\n' + F.join('\n')
    : 'install: one button, ' + previewClients.length + ' clients behind it, each with steps');
  if (F.length) document.title = 'FAIL install ' + F.length;
  window.__installRan = true;
})();
</script>
<script>
// A block that fails to parse never runs, its try/catch never fires, and the
// title is left saying PASS from the block before it. That has happened twice,
// so each block now leaves a mark and the last one checks they are all there.
(function () {
  const missing = ['__mainRan', '__styleRan', '__installRan'].filter(k => !window[k]);
  if (missing.length) {
    document.getElementById('out').textContent += '\nA CHECK BLOCK NEVER RAN: ' + missing.join(', ');
    document.title = 'FAIL dead-block';
  }
})();
</script>
