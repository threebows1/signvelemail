<!DOCTYPE html><html><head><meta charset="UTF-8"><title>export-check</title></head>
<body>
  <div class="app" id="app"><aside class="rail" id="rail"></aside>
  <div class="workspace"><header class="topbar" id="header"></header>
  <div class="body" id="appBody"><aside class="panel" id="panel"></aside><main class="stage" id="stage"></main></div></div></div>
  <div class="export-overlay hidden" id="exportOverlay"><div class="export-panel">
    <div class="export-panel-header"><h2>E</h2><button class="export-close" id="exportClose">x</button></div>
    <div class="export-targets-row"><div class="toggle-group" id="exportTargets"></div><p class="export-note" id="exportNote"></p></div>
    <pre class="export-code"><code id="exportCode"></code></pre>
    <div class="export-actions"><button class="btn btn-accent" id="exportCopyBtn">C</button></div></div></div>
  <link rel="stylesheet" href="../styles.css"><pre id="out" style="position:fixed;left:0;bottom:0;z-index:99;background:#fff"></pre>
  <script>try { localStorage.clear(); } catch (e) {}</script>
  <script src="../config.js"></script>
  <script src="../cloud.js"></script>
  <script src="../app.js"></script>
  <script>
  const E = [];
  // Every layout, every icon treatment, both Outlook variants.
  const MODES = ['circle','filled','icons','letters','labels'];
  const SOCIAL = ['circle','filled','chip','plain','outline'];
  Object.keys(templateThemes).forEach(t => {
    S.template = t;
    MODES.forEach(m => {
      S.contactIconMode = m;
      SOCIAL.forEach(s => {
        S.socialStyle = s;
        ['newoutlook','classic'].forEach(target => {
          const h = generateExportHTML(target);
          // Neither Outlook renders these, so neither may appear.
          if (/<svg/i.test(h))        E.push(t+'/'+m+'/'+s+'/'+target+': contains <svg>');
          if (/data:image/i.test(h))  E.push(t+'/'+m+'/'+s+'/'+target+': contains a data: image');
          
          // Word ignores a radius, so nothing classic actually renders may ask
          // for one. What sits in an <!--[if !mso]> block is invisible to it.
          if (target === 'classic') {
            const seen = h.replace(/<!--\[if !mso\]><!-->[\s\S]*?<!--<!\[endif\]-->/g, '');
            if (/border-radius:50%/.test(seen))
              E.push(t+'/'+m+'/'+s+'/classic: a round badge classic can see');
          }
        });
      });
    });
  });
  // Clean is not enough: a variant that dropped the glyph and put nothing back
  // would also pass every check above. The mark has to be there to be read.
  S.template='corporate'; S.socialStyle='circle';
  S.email='a@b.com'; S.phone='+971 4 000 0000'; S.website='b.com';
  ['circle','filled'].forEach(m => {
    S.contactIconMode = m;
    const n = generateExportHTML('newoutlook');
    // New Outlook keeps the drawing, served over https rather than inlined.
    ['c-email', 'c-phone', 'c-website'].forEach(f => {
      if (n.indexOf('https://signvel.com/icons/' + f + '-') < 0) E.push('newoutlook/' + m + ': no hosted ' + f);
    });
    if (!/border-radius:50%/.test(n)) E.push('newoutlook/' + m + ': lost its round badges');
    // Every badge is filled for New Outlook, so every badged glyph is white:
    // an ink glyph in there would be the black-in-a-blue-ring fault again.
    if (n.indexOf('c-email-white.png') < 0) E.push('newoutlook/' + m + ': badge glyph is not white');
    if (n.indexOf('c-email-ink.png') >= 0)  E.push('newoutlook/' + m + ': an ink glyph is still inside a badge');
    // The badge itself must carry the theme colour, which is what makes the
    // fill worth having — a grey disc would be no better than a black glyph.
    if (n.indexOf('bgcolor="' + S.accentColor + '"') < 0 && n.toLowerCase().indexOf('bgcolor="' + S.accentColor.toLowerCase() + '"') < 0)
      E.push('newoutlook/' + m + ': the filled badge is not the theme colour');
    const c = generateExportHTML('classic');
    ['E.','T.','W.'].forEach(L => {
      if (c.indexOf('>' + L + '<') < 0) E.push('classic/' + m + ': no ' + L + ' lead');
    });
  });

  // The standard variant must be untouched, and the preview must not be left
  // on a client's variant afterwards.
  S.template='corporate'; S.contactIconMode='circle'; S.socialStyle='circle';
  if (!/<svg|data:image/i.test(generateExportHTML('')))   E.push('standard export lost its glyphs');
  generateExportHTML('classic');
  if (EXPORT_TARGET !== null) E.push('EXPORT_TARGET left set after an export');
  if (!/<svg|data:image/i.test(generateSignaturePreview())) E.push('the live preview was left on a variant');
  // The dialog offers all three.
  showExport();
  const btns = [].map.call(document.querySelectorAll('#exportTargets button'), b => b.dataset.target);
  if (btns.join(',') !== ',newoutlook,classic') E.push('targets offered: ' + btns.join(','));
  // Clicking a target has to swap the code in the box — that box is what the
  // copy button reads, so anything it does not update is never copied.
  const code = document.getElementById('exportCode');
  const standard = code.textContent;
  const note = document.getElementById('exportNote').textContent;
  document.querySelector('#exportTargets button[data-target="classic"]').click();
  if (code.textContent === standard)     E.push('clicking classic did not change the code');
  if (/<svg|data:image/i.test(code.textContent)) E.push('the classic box still holds a stripped glyph');
  if (document.getElementById('exportNote').textContent === note) E.push('the note did not follow the target');
  if (!document.querySelector('#exportTargets button[data-target="classic"]').className.match(/active|is-on|selected/))
    E.push('the clicked target is not marked');
  document.querySelector('#exportTargets button[data-target=""]').click();
  if (code.textContent !== standard)     E.push('going back to Standard did not restore it');

  // The client tab is the target now: three Outlook tabs, each writing the
  // signature differently, and every other client on Standard.
  const tab = id => document.querySelector('#clientTabs button[data-client="' + id + '"]');
  const shown = () => document.querySelector('.signature-container').innerHTML;
  const tabIds = [].map.call(document.querySelectorAll('#clientTabs button'), b => b.dataset.client);
  ['outlook-new', 'outlook-classic', 'outlook'].forEach(id => {
    if (tabIds.indexOf(id) < 0) E.push('no ' + id + ' tab');
  });
  if (!/<svg|data:image/i.test(shown())) E.push('the preview did not start on Standard');

  tab('outlook-classic').click();
  if (currentTarget() !== 'classic') E.push('the Classic Outlook tab did not set the target');
  if (!tab('outlook-classic').classList.contains('active')) E.push('the clicked tab is not marked');
  // The whole point of splitting the tab: the preview has to change with it.
  if (/<svg|data:image/i.test(shown())) E.push('the preview did not redraw for Classic Outlook');
  if (!document.querySelector('#exportTargets button[data-target="classic"]').classList.contains('active'))
    E.push('the dialog did not follow the tab');
  // What the copy button would put on the clipboard, by the same route it takes.
  if (/<svg|data:image/i.test(withExportTarget(currentTarget(), generateSignaturePreview)))
    E.push('Copy signature ignored the chosen tab');

  tab('outlook-new').click();
  if (currentTarget() !== 'newoutlook') E.push('the New Outlook tab did not set the target');
  if (/<svg|data:image/i.test(shown())) E.push('the preview did not redraw for New Outlook');
  if (!/border-radius:50%/.test(shown())) E.push('New Outlook lost its round badges in the preview');

  // Standard Outlook, and every client that is not Outlook, gets the ordinary
  // markup back — the target must not stick once the tab moves off Outlook.
  tab('outlook').click();
  if (currentTarget() !== '') E.push('Standard Outlook did not go back to Standard');
  if (!/<svg|data:image/i.test(shown())) E.push('Standard Outlook is still drawing a variant');
  tab('outlook-classic').click();
  tab('gmail').click();
  if (currentTarget() !== '') E.push('the target stuck after moving to Gmail');
  if (!/<svg|data:image/i.test(shown())) E.push('Gmail is still drawing a variant');

  // Choosing in the dialog has to move the tab, so the two never disagree.
  document.querySelector('#exportTargets button[data-target="classic"]').click();
  if (S.client !== 'outlook-classic') E.push('the dialog did not move the tab: ' + S.client);
  if (!tab('outlook-classic').classList.contains('active')) E.push('the moved tab is not marked');
  document.querySelector('#exportTargets button[data-target=""]').click();
  if (EXPORT_TARGET !== null) E.push('the preview bar left EXPORT_TARGET set');
  document.getElementById('out').textContent = E.length ? E.slice(0,12).join('\n') + '\n\n(' + E.length + ' total)' : 'ok — 24 layouts x 25 combinations, both variants clean';
  document.title = E.length ? 'FAIL ' + E.length : 'PASS';
  </script>
</body></html>
<script>
// The picker has to be legible in the dark dialog: on screen, big enough to
// hit, and not text the same colour as what is behind it.
(function () {
  const F = [];
  // A throw in here used to take the whole report with it, silently, leaving a
  // PASS that had checked nothing. It is caught and reported now.
  try {
  const row = document.querySelector('.export-targets-row');
  const bs = [].slice.call(document.querySelectorAll('#exportTargets button'));
  const rowBg = getComputedStyle(row).backgroundColor;
  const panelBg = getComputedStyle(document.querySelector('.export-panel')).backgroundColor;
  bs.forEach(b => {
    const r = b.getBoundingClientRect(), cs = getComputedStyle(b);
    // 23px is what every .toggle-group button in the app measures.
    if (r.width < 60 || r.height < 22) F.push(b.textContent + ': ' + Math.round(r.width) + 'x' + Math.round(r.height));
    if (cs.color === (cs.backgroundColor === 'rgba(0, 0, 0, 0)' ? (rowBg === 'rgba(0, 0, 0, 0)' ? panelBg : rowBg) : cs.backgroundColor))
      F.push(b.textContent + ': text the same colour as its ground');
  });
  // The three Outlook tabs, in the light bar rather than the dialog.
  const hb = [].slice.call(document.querySelectorAll('#clientTabs button')).filter(function (b) { return /outlook/.test(b.dataset.client); });
  if (hb.length !== 3) F.push('Outlook tabs: ' + hb.length);
  hb.forEach(function (b) {
    const r = b.getBoundingClientRect();
    if (r.width < 45 || r.height < 18) F.push('tab ' + b.textContent + ': ' + Math.round(r.width) + 'x' + Math.round(r.height));
  });
  // Whether they wrap depends on the window, which this one is far too narrow
  // to judge. What must hold at any width is that the three are adjacent, so
  // they read as one client split three ways rather than scattered.
  const order = [].map.call(document.querySelectorAll('#clientTabs button'), b => b.dataset.client);
  const at = order.map((id, i) => /outlook/.test(id) ? i : -1).filter(i => i >= 0);
  if (at.length === 3 && (at[1] !== at[0] + 1 || at[2] !== at[1] + 1))
    F.push('the Outlook tabs are not adjacent: ' + order.join(' '));
  const note = document.getElementById('exportNote').getBoundingClientRect();
  if (note.height < 10) F.push('the note is not on screen');
  // The three sit on one line rather than stacking.
  if (bs.length === 3 && (bs[0].getBoundingClientRect().top !== bs[2].getBoundingClientRect().top)) F.push('the targets wrapped onto two lines');
  const out = document.getElementById('out');
  const dims = l => l.map(b => Math.round(b.getBoundingClientRect().width) + 'x' + Math.round(b.getBoundingClientRect().height)).join(' ');
  const summary = 'dialog picker: ' + dims(bs) + ', on one line, legible\nOutlook tabs:  ' + dims(hb) + ', adjacent';
  // The headless window is far narrower than any real editor, so measuring the
  // row as it falls here says nothing. Widen the bar and find the width at
  // which the clients, the targets and the device toggle share one row.
  // The bar is two declared rows now, not one left to wrap. Each row's natural
  // width is added up — every group end to end plus the gaps and the bar's own
  // padding — to give the stage width each needs before it wraps again.
  const barEl = document.querySelector('.stage-toolbar');
  const pad = parseFloat(getComputedStyle(barEl).paddingLeft) + parseFloat(getComputedStyle(barEl).paddingRight);
  // Measured boxes are whatever this narrow window squeezed them to, so the
  // width is summed from the leaves up instead: the buttons themselves do not
  // shrink, and their total is the width the row needs wherever it is shown.
  const natural = el => {
    const kids = [].slice.call(el.children);
    if (!kids.length) return el.getBoundingClientRect().width;
    const g = parseFloat(getComputedStyle(el).gap) || 0;
    return kids.reduce((n, k) => n + natural(k), 0) + g * Math.max(0, kids.length - 1);
  };
  const barRows = [].slice.call(barEl.querySelectorAll('.stage-toolbar-row'));
  if (barRows.length !== 2) F.push('the bar is ' + barRows.length + ' declared rows, not 2');
  // Two rows has to mean two: stacked, whatever the width. Whether a row wraps
  // internally on a narrow window is the bar's own behaviour and not a fault.
  if (barRows.length === 2 && Math.round(barRows[0].getBoundingClientRect().top) === Math.round(barRows[1].getBoundingClientRect().top))
    F.push('the two rows landed on the same line');
  const needs = barRows.length === 2 ? barRows.map(r => Math.round(natural(r) + pad)) : [];
  // Printed last, so a fault found anywhere above actually reaches the report.
  out.textContent += '\n' + (F.length ? 'STYLE FAIL:\n' + F.join('\n')
    : summary + '\ntwo declared rows, stacked — row 1 needs ' + needs[0] + 'px of stage, row 2 needs ' + needs[1] + 'px');
  if (F.length) document.title = 'FAIL style ' + F.length;
  } catch (err) {
    document.getElementById('out').textContent += '\nSTYLE CHECK THREW: ' + err.message;
    document.title = 'FAIL style threw';
  }
})();
</script>
<script>
// Every hosted glyph the New Outlook variant asks for must exist as a file,
// or the recipient gets a broken image where the icon should be. Checked by
// loading each one, not by trusting the name.
(function () {
  const urls = new Set();
  const MODES = ['circle','filled','icons','letters','labels'];
  const SOCIAL = ['circle','filled','chip','plain','outline'];
  Object.keys(templateThemes).forEach(t => {
    S.template = t;
    MODES.forEach(m => { S.contactIconMode = m;
      SOCIAL.forEach(s => { S.socialStyle = s;
        const h = generateExportHTML('newoutlook');
        (h.match(/https:\/\/signvel\.com\/icons\/[a-z0-9-]+\.png/g) || []).forEach(u => urls.add(u));
      });
    });
  });
  const out = document.getElementById('out');
  const list = Array.from(urls); // a Set has no length, so [].slice.call would give []
  if (!list.length) { out.textContent += '\nNO HOSTED ICONS REFERENCED'; document.title = 'FAIL icons 0'; return; }
  let done = 0; const missing = [], blank = [];
  list.forEach(u => {
    const img = new Image();
    // Loaded from the local file the URL maps to, since the harness runs offline.
    const local = '../icons/' + u.split('/').pop();
    // A valid PNG can still be blank, which would look exactly like success
    // in every other check here, so the pixels are counted.
    img.onload  = () => {
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const d = ctx.getImageData(0, 0, c.width, c.height).data;
      let lit = 0;
      for (let i = 3; i < d.length; i += 4) if (d[i] > 8) lit++;
      const pct = lit / (c.width * c.height);
      if (pct < 0.02) blank.push(u.split('/').pop() + ' ' + Math.round(pct * 100) + '%');
      if (++done === list.length) report();
    };
    img.onerror = () => { missing.push(u.split('/').pop()); if (++done === list.length) report(); };
    img.src = local;
  });
  function report() {
    out.textContent += missing.length ? '\nMISSING ICON FILES: ' + missing.join(', ')
      : blank.length ? '\nBLANK ICON FILES: ' + blank.join(', ')
      : '\n' + list.length + ' hosted glyphs referenced, every file present and drawn';
    if (missing.length || blank.length) document.title = 'FAIL icons ' + (missing.length + blank.length);
  }
})();
</script>
<script>
// The fault the tab split introduced: the target lived alongside S.client
// instead of being derived from it, so a reload restored the tab with the
// preview, the copy and the export all still on Standard.
(function () {
  const F = [];
  S.client = 'outlook-new';
  if (currentTarget() !== 'newoutlook') F.push('a restored New Outlook tab does not give its target');
  renderStage();
  const shown = document.querySelector('.signature-container').innerHTML;
  if (/<svg|data:image/i.test(shown)) F.push('a restored tab renders the preview as Standard');
  if (document.querySelector('.stage-target-note').textContent.indexOf('Standard') === 0)
    F.push('a restored tab shows the Standard note');
  S.client = 'gmail';
  if (currentTarget() !== '') F.push('Gmail does not give Standard');
  renderStage();
  const out = document.getElementById('out');
  out.textContent += '\n' + (F.length ? 'RELOAD FAIL:\n' + F.join('\n') : 'a restored tab carries its target into the preview');
  if (F.length) document.title = 'FAIL reload ' + F.length;
})();
</script>
<script>
// The exactly-coloured glyphs: uploaded per account, so the harness stands in
// for the upload and checks what the markup does with the result.
(function () {
  const F = [];
  S.template = 'corporate'; S.socialStyle = 'circle';
  // Keyed on the colour the renderer resolves, not the accent: a layout can
  // override the icon colour, and the key has to follow what is drawn.
  S.accentColor = '#2B4C7E'; S.iconColor = '#2B4C7E'; S.socialIconColor = '#2B4C7E';
  S.iconAssets = {};

  // Without a set, the badge fills so the colour is at least in the ground.
  S.contactIconMode = 'circle';
  let h = generateExportHTML('newoutlook');
  if (h.indexOf('c-email-white.png') < 0) F.push('no set: the badge did not fall back to filled white');

  // With one, the ring stays open and the glyph carries the colour.
  const url = 'https://example.test/icon/email-2b4c7e.png';
  S.iconAssets[iconAssetKey('email', S.iconColor)] = url;
  h = generateExportHTML('newoutlook');
  if (h.indexOf(url) < 0) F.push('the uploaded glyph was not used');
  if (h.indexOf('c-email-white.png') >= 0) F.push('the badge is still filled white with a set available');
  if (h.indexOf('c-email-ink.png') >= 0) F.push('an ink glyph survived alongside the set');

  // The bare treatment is the other half of the report: it was black.
  S.contactIconMode = 'icons';
  h = generateExportHTML('newoutlook');
  if (h.indexOf(url) < 0) F.push('the bare glyph did not use the uploaded colour');
  if (h.indexOf('c-email-ink.png') >= 0) F.push('the bare glyph is still ink');

  // A colour change must not reuse the old file.
  S.accentColor = '#B4121F'; S.iconColor = '#B4121F'; S.socialIconColor = '#B4121F';
  h = generateExportHTML('newoutlook');
  if (h.indexOf(url) >= 0) F.push('a new colour reused the old glyph');

  // Nothing here may reach a client as an embedded image, which is the whole
  // reason the files exist.
  if (/data:image|<svg/i.test(h)) F.push('the variant fell back to something New Outlook strips');

  S.accentColor = '#2B4C7E'; S.iconColor = ''; S.socialIconColor = ''; S.contactIconMode = 'circle'; S.iconAssets = {};
  const out = document.getElementById('out');
  out.textContent += '\n' + (F.length ? 'COLOUR FAIL:\n' + F.join('\n')
    : 'exact-colour glyphs: used when present, filled-white fallback when not');
  if (F.length) document.title = 'FAIL colour ' + F.length;
})();
</script>
