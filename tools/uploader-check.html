<!DOCTYPE html><html><head><meta charset="UTF-8"><title>uploader-check</title>
<link rel="stylesheet" href="../styles.css"></head><body>
<div class="app" id="app"><aside class="rail" id="rail"></aside><div class="workspace"><header class="topbar" id="header"></header>
<div class="body" id="appBody"><aside class="panel" id="panel"></aside><main class="stage" id="stage"></main></div></div></div>
<div class="install-overlay hidden" id="installOverlay"><div class="install-panel"><div class="install-panel-header"><h2 id="installTitle">I</h2><button class="btn" id="installClose">c</button></div><div class="install-body" id="installBody"></div></div></div>
<div class="install-overlay hidden" id="shareOverlay"><div class="install-panel"><div class="install-panel-header"><h2>S</h2><button class="btn" id="shareClose">c</button></div><div class="install-body"><div class="share-row"><input id="shareUrl"><button class="btn" id="shareCopyLink">C</button></div><p id="shareSize"></p><div class="install-actions"><a id="shareOpen" href="#">o</a></div></div></div></div>
<div class="export-overlay hidden" id="exportOverlay"><div class="export-panel"><div class="export-panel-header"><h2>E</h2><button class="export-close" id="exportClose">x</button></div><div class="export-targets-row"><div class="toggle-group" id="exportTargets"></div><p id="exportNote"></p></div><pre><code id="exportCode"></code></pre><div class="export-actions"><button class="btn" id="exportCopyBtn">C</button></div></div></div>
<pre id="out" style="position:fixed;left:0;bottom:0;background:#fff;z-index:99"></pre>
<script>try{localStorage.clear()}catch(e){}</script>
<script src="../config.js"></script><script src="../cloud.js"></script><script src="../app.js"></script>
<script>
const F = [];
// Open the Media section, where the logo and headshot slots live.
const idx = sections.findIndex(s => s.id === 'media');
S.openSection = idx >= 0 ? idx : S.openSection;
renderPanel();
const zones = [].slice.call(document.querySelectorAll('.uploader'));
if (zones.length < 1) F.push('no uploader in the panel (section ' + idx + ')');
zones.forEach(z => {
  // Filled is now told by the foot beneath the box, since the box itself no
  // longer changes: there is no is-loaded class to look for any more.
  const loaded = !!z.closest('.uploader-wrap');
  const where = loaded ? 'filled' : 'empty';
  // Both states say the same thing and both take a drop.
  if (!z.getAttribute('data-drop')) F.push(where + ': not a drop target');
  if (!z.querySelector('input[type=file]')) F.push(where + ': no file input inside the zone');
  if (z.tagName !== 'LABEL') F.push(where + ': the zone is a ' + z.tagName + ', so clicking it opens nothing');
  const text = (z.querySelector('.uploader-text') || {}).textContent || '';
  if (!/drop/i.test(text)) F.push(where + ': says "' + text + '" rather than inviting a drop');
  if (/replace/i.test(z.textContent)) F.push(where + ': still says Replace');
  // The box holds no picture in either state: the signature beside it is
  // already showing the image, at the size it will be sent.
  if (z.querySelector('img')) F.push(where + ': there is a picture inside the box');
});
// Remove has to sit outside the label, or clicking it opens the file dialog.
const removes = [].slice.call(document.querySelectorAll('[data-action^="remove"]'));
if (!removes.length) F.push('no Remove control at all');
removes.forEach(r => {
  if (r.closest('label')) F.push('Remove is inside a label, so it would open the file picker too');
});
// The zone has to be big enough to drop on.
zones.forEach(z => {
  const b = z.getBoundingClientRect();
  if (b.height < 60 || b.width < 120) F.push('a zone is only ' + Math.round(b.width) + 'x' + Math.round(b.height));
});
// And every box the same size as every other. The logo's note runs to two
// lines and the headshot's to one, which left them different heights sitting
// one above the other.
const boxes = zones.map(z => z.getBoundingClientRect());
const hs = boxes.map(b => Math.round(b.height));
const ws = boxes.map(b => Math.round(b.width));
if (new Set(hs).size > 1) F.push("boxes are different heights: " + hs.join(", "));
// Square, and the size asked for.
boxes.forEach(function (b) {
  const w = Math.round(b.width), h = Math.round(b.height);
  if (Math.abs(w - h) > 1) F.push("a box is not square: " + w + "x" + h);
  if (w !== 270) F.push("a box is " + w + " wide, not 270");
});
// A fixed square can be too small for what is written inside it, and the
// text spills out rather than the box growing to fit.
zones.forEach(function (z) {
  if (z.scrollHeight > z.clientHeight + 1)
    F.push('the text overflows its box by ' + (z.scrollHeight - z.clientHeight) + 'px');
});
if (new Set(ws).size > 1) F.push('boxes are different widths: ' + ws.join(', '));
const filledSize = hs[0] + 'x' + ws[0];
// Both slots ship with a picture in them, so the empty state has to be asked
// for — otherwise only half of this is ever checked.
S.logoUrl = ''; S.headshotUrl = '';
renderPanel();
const empties = [].slice.call(document.querySelectorAll('.uploader'));
if (!empties.length) F.push('no uploader once the images are cleared');
empties.forEach(function (z) {
  if (z.closest('.uploader-wrap')) F.push('empty: still carries the filled foot');
  if (z.tagName !== 'LABEL') F.push('empty: the zone is a ' + z.tagName);
  if (!z.querySelector('input[type=file]')) F.push('empty: no file input');
  if (!/drop/i.test((z.querySelector('.uploader-text') || {}).textContent || '')) F.push('empty: no invitation to drop');
  if (z.querySelector('img')) F.push('empty: there is a picture inside the box');
});
// Emptying a slot must not change the size of its box either.
const emptySizes = empties.map(z => {
  const b = z.getBoundingClientRect();
  return Math.round(b.height) + 'x' + Math.round(b.width);
});
if (new Set(emptySizes).size > 1) F.push('empty boxes differ: ' + emptySizes.join(', '));
if (emptySizes[0] && emptySizes[0] !== filledSize)
  F.push('a box changes size when the slot empties: ' + filledSize + ' filled, ' + emptySizes[0] + ' empty');

document.getElementById('out').textContent = F.length ? F.join('\n')
  : 'every box ' + filledSize + ', filled and empty, both taking a drop';
document.title = F.length ? 'FAIL ' + F.length : 'PASS';
</script></body></html>
