<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>gate</title><link rel="stylesheet" href="../styles.css"></head>
<body>
  <div class="app" id="app">
    <aside class="rail" id="rail"></aside>
    <div class="workspace"><header class="topbar" id="header"></header>
      <div class="body" id="appBody"><aside class="panel" id="panel"></aside><main class="stage" id="stage"></main></div></div>
  </div>
  <div class="export-overlay hidden" id="exportOverlay"><div class="export-panel">
    <div class="export-panel-header"><h2>E</h2><button class="export-close" id="exportClose">x</button></div>
    <pre class="export-code"><code id="exportCode"></code></pre>
    <div class="export-actions"><button class="btn btn-accent" id="exportCopyBtn">C</button></div></div></div>
  <pre id="report" style="position:fixed;left:0;bottom:0;background:#fff;z-index:99;font:12px monospace"></pre>
  <script>
    window.__errs = [];
    window.onerror = (m, s, l, c) => { window.__errs.push('JS: ' + m + ' @' + l + ':' + c); };
    try { localStorage.clear(); } catch (e) {}
    // #in  = a configured cloud with a live session
    // #out = a configured cloud with nobody signed in
    // #off = no cloud at all, the local-checkout case
    window.__mode = (location.hash || '#out').replace('#', '');
    // Where the lock sends people. app.js calls this instead of navigating so
    // the harness can read the destination without leaving the page.
    window.__wentTo = null;
    window.__navigate = function (url) { window.__wentTo = url; };

    if (window.__mode !== 'off') {
      const signedIn = window.__mode === 'in';
      window.Cloud = {
        isReady: true,
        _cbs: [],
        state: () => ({ready:true, signedIn, email: signedIn ? 'a@b.com' : null,
                       userId: signedIn ? 'u1' : null, plan:'team', isAdmin:false}),
        onChange(fn) { this._cbs.push(fn); },
        init() { return Promise.resolve(this.state()); },
        loadSignature() { return Promise.resolve(null); },
        saveSignature() { return Promise.resolve({ok:true}); },
        uploadAsset() { return Promise.resolve({ok:false, error:'stub'}); },
        signOut() { return Promise.resolve({ok:true}); },
        adminStats() { return Promise.resolve({ok:false, error:'stub'}); },
      };
    }
  </script>
  <script>
    // The lock is applied and, for a live session, lifted again before any
    // later script tag can look â€” microtasks drain between the two. Watching
    // for the class is the only way to see that it was ever set.
    window.__sawLock = document.body.classList.contains('app-locked');
    new MutationObserver(() => {
      if (document.body.classList.contains('app-locked')) window.__sawLock = true;
    }).observe(document.body, {attributes:true, attributeFilter:['class']});
  </script>
  <script src="../config.js"></script>
  <script src="../app.js"></script>
  <script>
  (function () {
    const E = window.__errs;
    const mode = window.__mode;

    // The lock must go on before any render, not after the session resolves.
    if (mode !== 'off' && !window.__sawLock) {
      E.push(mode + ': editor was never locked at startup');
    }
    if (mode === 'off' && window.__sawLock) {
      E.push('no cloud: editor was locked even though there is no account system');
    }

    setTimeout(() => {
      const locked = document.body.classList.contains('app-locked');
      const went = window.__wentTo;

      if (mode === 'out') {
        if (!locked) E.push('signed out: editor is not locked');
        // Sign-in is a page now, so the assertion is about leaving rather than
        // about a panel that cannot be dismissed.
        if (!went) E.push('signed out: never sent to the sign-in page');
        else if (!/^signin\.html/.test(went)) E.push('signed out: sent somewhere other than sign-in: ' + went);
        else if (!/[?&]next=editor\.html/.test(went)) E.push('signed out: no next=, so the editor is not returned to: ' + went);
      }

      if (mode === 'in') {
        if (locked) E.push('signed in: editor stayed locked');
        if (went) E.push('signed in: redirected away from the editor: ' + went);
        // Signing out must throw you back out to the sign-in page.
        const orig = Cloud.state;
        Cloud.state = () => Object.assign({}, orig(), {signedIn:false, email:null, userId:null});
        Cloud._cbs.forEach(fn => fn(Cloud.state()));
        if (!document.body.classList.contains('app-locked')) E.push('signed in: signing out did not re-lock');
        if (!window.__wentTo) E.push('signed in: signing out did not send anyone anywhere');
      }

      if (mode === 'off') {
        if (locked) E.push('no cloud: editor locked with no account system to sign into');
        if (went) E.push('no cloud: redirected to sign-in with no cloud to sign into');
      }

      document.getElementById('report').textContent = E.length ? E.join('\n') : 'ok (' + mode + ')';
      document.title = E.length ? 'FAIL ' + E.length : 'PASS';
    }, 80);
  })();
  </script>
</body>
</html>
