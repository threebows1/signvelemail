<script>
// The headshot controls must reach every layout that draws a photo. Seven of
// them once forced a circle, so Rounded and Square did nothing there.
const F = [];
window.SIGNVEL_SHOW_IMAGES = true;
S.headshotUrl = 'https://example.com/face.jpg';
const radiusOf = (h) => { const m = h.match(/<div style="width:(\d+)px;height:\1px;border-radius:([^;]+);[^"]*overflow:hidden;"><img src="https:\/\/example\.com\/face\.jpg"/); return m ? {box: +m[1], radius: m[2]} : null; };
PHOTO_TEMPLATES.forEach((id) => {
  S.template = id; applyTemplateTheme(id);
  S.headshotUrl = 'https://example.com/face.jpg';
  const want = {circle: '50%', rounded: '10px', square: '0'};
  Object.keys(want).forEach((shape) => {
    S.headshotShape = shape;
    const r = radiusOf(generateSignaturePreview());
    if (!r) { F.push(id + ': no framed photo found'); return; }
    if (r.radius !== want[shape]) F.push(id + ': shape ' + shape + ' drew radius ' + r.radius);
  });
  S.headshotShape = 'circle';
  S.headshotSize = 100;
  const r = radiusOf(generateSignaturePreview());
  if (r && r.box !== 100) F.push(id + ': photo size 100 drew ' + r.box + 'px');
  S.headshotSize = 0;
});
// Photo position stands aside where the photo has a row to itself.
S.template = 'masthead'; applyTemplateTheme('masthead');
const panel = renderMedia();
if (!/is-inactive[\s\S]*Photo position[\s\S]*row of its own/.test(panel)) F.push('masthead: Photo position does not say it has nothing to align against');
S.template = 'aside'; applyTemplateTheme('aside');
if (/row of its own/.test(renderMedia())) F.push('aside: Photo position is wrongly marked inactive');
document.getElementById('out').textContent = F.length ? F.join('\n') : PHOTO_TEMPLATES.length + ' photo layouts honour shape and size; Photo position stands aside where it cannot apply';
document.title = F.length ? 'FAIL ' + F.length : 'PASS';
</script></body></html>
