<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile settings - Sign Vel</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" sizes="180x180">
  <link rel="apple-touch-icon" href="/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="db db-loading">

  <header class="db-top">
    <a class="db-brand" href="index.html" aria-label="Sign Vel home">
      <svg width="40" height="17" viewBox="0 0 88 37" aria-hidden="true"><defs><linearGradient id="acLogo" x1="0" x2="1"><stop offset="0" stop-color="#5B2EFF"/><stop offset="1" stop-color="#00E5A0"/></linearGradient></defs><path d="M8 22c7-16 12-21 16-19 5 2 3 18 7 19s8-13 13-13 4 13 15 9" fill="none" stroke="url(#acLogo)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="76" cy="27" r="5" fill="#9D4EDD"/></svg>
      <span class="db-word">Sign <em>Vel</em></span>
    </a>
    <nav class="db-nav" aria-label="Main">
      <a href="signatures.html">Signatures</a>
      <a href="install.html">Install guides</a>
      <a href="help.html">Help</a>
    </nav>
    <span class="db-spacer"></span>
    <div class="db-account">
      <button class="db-avatar" id="dbAvatar" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu"></button>
      <!-- Drawn by account-menu.js, so it is the same on every page that has it. -->
      <div class="db-menu db-account-menu" id="dbAccountMenu" role="menu" hidden></div>
    </div>
  </header>

  <main class="db-main ac-main">
    <div class="db-head"><h1>Profile settings</h1></div>

    <div class="ac-layout">
      <!-- Who this account is, at a glance: the card the rest of the page edits. -->
      <aside class="ac-side" aria-label="Your account">
        <div class="ac-photo" id="acPhoto" aria-hidden="true"></div>
        <p class="ac-side-name" id="acSideName"></p>
        <p class="ac-side-email" id="acSideEmail"></p>
        <div class="ac-side-plan">
          <p class="ac-plan-name" id="acPlanName"></p>
          <p class="ac-hint" id="acPlanNote"></p>
        </div>
        <div class="db-usage-main" id="acUsage"></div>
        <a class="db-btn ac-side-btn" href="pricing.html">Compare plans</a>
      </aside>

      <div class="ac-forms">
        <section class="ac-card" aria-labelledby="acProfileH">
          <div class="ac-card-head">
            <h2 id="acProfileH">Photo and name</h2>
            <p>Shown in your account menu.</p>
          </div>
          <div class="ac-photo-actions">
            <label class="db-btn" for="acFile">Choose a photo</label>
            <input type="file" id="acFile" accept="image/png,image/jpeg,image/webp,image/gif" class="db-sr">
            <button type="button" class="db-btn" id="acRemove">Remove photo</button>
            <p class="ac-hint">JPG, PNG or WebP, cropped to a square.</p>
          </div>
          <label class="db-field">
            <span>Display name</span>
            <input type="text" id="acName" maxlength="120" autocomplete="name">
          </label>
          <div class="ac-actions">
            <button type="button" class="db-btn db-btn-primary" id="acSaveProfile">Save changes</button>
            <p class="ac-msg" id="acProfileMsg" role="status" aria-live="polite"></p>
          </div>
        </section>

        <section class="ac-card" aria-labelledby="acEmailH">
          <div class="ac-card-head">
            <h2 id="acEmailH">Sign-in email</h2>
            <p>A new address is confirmed by email before it replaces this one.</p>
          </div>
          <label class="db-field">
            <span>Email address</span>
            <input type="email" id="acEmail" autocomplete="email">
          </label>
          <div class="ac-actions">
            <button type="button" class="db-btn" id="acSaveEmail">Update email</button>
            <p class="ac-msg" id="acEmailMsg" role="status" aria-live="polite"></p>
          </div>
        </section>

        <section class="ac-card" aria-labelledby="acPassH">
          <div class="ac-card-head">
            <h2 id="acPassH">Password</h2>
            <p>At least 8 characters.</p>
          </div>
          <div class="ac-two">
            <label class="db-field">
              <span>New password</span>
              <input type="password" id="acPass" autocomplete="new-password" minlength="8">
            </label>
            <label class="db-field">
              <span>Confirm new password</span>
              <input type="password" id="acPass2" autocomplete="new-password" minlength="8">
            </label>
          </div>
          <div class="ac-actions">
            <button type="button" class="db-btn" id="acSavePass">Update password</button>
            <p class="ac-msg" id="acPassMsg" role="status" aria-live="polite"></p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <p class="db-toast" id="dbToast" role="status" aria-live="polite" hidden></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="account-menu.js"></script>
  <script src="account.js"></script>
</body>
</html>
