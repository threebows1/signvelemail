<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signatures - Sign Vel</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" sizes="180x180">
  <link rel="apple-touch-icon" href="/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>
<!-- Signed-in only. Hidden until the session is known: showing an empty
     dashboard and then filling it, or bouncing to sign-in after a flash of it,
     both read as something broken. -->
<body class="db db-loading">

  <header class="db-top">
    <a class="db-brand" href="index.html" aria-label="Sign Vel home">
      <svg width="40" height="17" viewBox="0 0 88 37" aria-hidden="true"><defs><linearGradient id="dbLogo" x1="0" x2="1"><stop offset="0" stop-color="#5B2EFF"/><stop offset="1" stop-color="#00E5A0"/></linearGradient></defs><path d="M8 22c7-16 12-21 16-19 5 2 3 18 7 19s8-13 13-13 4 13 15 9" fill="none" stroke="url(#dbLogo)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="76" cy="27" r="5" fill="#9D4EDD"/></svg>
      <span class="db-word">Sign <em>Vel</em></span>
    </a>
    <nav class="db-nav" aria-label="Main">
      <a href="signatures.html" aria-current="page">Signatures</a>
      <a href="install.html">Install guides</a>
      <a href="help.html">Help</a>
    </nav>
    <span class="db-spacer"></span>
    <span class="db-plan" id="dbPlan"></span>
    <button class="db-btn db-btn-primary" id="dbNew" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span class="db-new-label">New signature</span>
    </button>
    <div class="db-account">
      <button class="db-avatar" id="dbAvatar" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu"></button>
      <div class="db-menu db-account-menu" id="dbAccountMenu" role="menu" hidden>
        <p class="db-menu-who" id="dbWho"></p>
        <a role="menuitem" class="db-menu-item" href="signatures.html">
          <span class="db-menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span>
          <span><strong>Dashboard</strong><small>Your signatures</small></span>
        </a>
        <a role="menuitem" class="db-menu-item" href="account.html">
          <span class="db-menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>
          <span><strong>Account</strong><small>Profile and password</small></span>
        </a>
        <a role="menuitem" class="db-menu-item" href="admin.html" id="dbAdmin" hidden>
          <span class="db-menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg></span>
          <span><strong>Admin</strong><small>Accounts and plans</small></span>
        </a>
        <hr>
        <button role="menuitem" type="button" class="db-menu-item is-out" id="dbSignOut">
          <span class="db-menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg></span>
          <span><strong>Sign out</strong></span>
        </button>
      </div>
    </div>
  </header>

  <div class="db-banner" id="dbBanner" hidden></div>

  <main class="db-main">
    <div class="db-head">
      <h1>Signatures</h1>
      <span class="db-spacer"></span>
      <label class="db-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="db-sr">Search signatures</span>
        <input type="search" id="dbSearch" placeholder="Search signatures" autocomplete="off">
      </label>
      <div class="db-views" id="dbViews">
        <button type="button" data-view="grid" aria-pressed="true" aria-label="Grid view"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
        <button type="button" data-view="list" aria-pressed="false" aria-label="List view"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
      </div>
    </div>

    <div class="db-usage db-usage-top" id="dbUsageTop" hidden></div>

    <!-- Everything the dashboard says about the account — loading, empty, a
         failure — is said here, so the list below only ever holds signatures. -->
    <div class="db-status" id="dbStatus" role="status" aria-live="polite"></div>

    <div id="dbList"></div>

    <section class="db-usage db-usage-bottom" id="dbUsage" aria-label="Signature allowance" hidden></section>
  </main>

  <div class="db-scrim" id="dbScrim" hidden></div>
  <div class="db-dialog" id="dbDialog" role="dialog" aria-modal="true" aria-labelledby="dbDialogTitle" hidden>
    <h2 id="dbDialogTitle"></h2>
    <div id="dbDialogBody"></div>
    <div class="db-dialog-actions">
      <button type="button" class="db-btn" id="dbDialogCancel">Cancel</button>
      <button type="button" class="db-btn db-btn-primary" id="dbDialogOk">OK</button>
    </div>
  </div>

  <p class="db-toast" id="dbToast" role="status" aria-live="polite" hidden></p>

  <!-- Order matters: dashboard.js needs Cloud and the renderer. The renderer is
       the editor's own, run without the editor around it — the way the
       shared-link page uses it — so a thumbnail is the real signature drawn
       small, not a sketch of one. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script>window.SIGNVEL_MODE = 'dashboard';</script>
  <script src="app.js"></script>
  <script src="account-menu.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
