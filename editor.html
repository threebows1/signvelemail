<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Vel - Email Signature Editor</title>

  <!-- SVG first for anything modern; the PNG is the fallback and the iOS
       home-screen icon. Regenerate both by opening tools/make-favicon.html and saving the PNG here. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" sizes="180x180">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta name="description" content="Create professional, email-client-safe signatures with live preview for Gmail, Outlook, and Apple Mail.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <!-- Google Analytics (G-0KGVSNEJVC). Loaded async so it never blocks the
       page; every stylesheet and script below is unaffected by it. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0KGVSNEJVC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-0KGVSNEJVC');
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" id="rail"></aside>
    <div class="workspace">
      <header class="topbar" id="header"></header>
      <div class="body" id="appBody">
        <aside class="panel" id="panel"></aside>
        <main class="stage" id="stage"></main>
      </div>
    </div>
  </div>
  <!-- A link to this signature. The signature is in the link itself, so
       whoever opens it needs no account and nothing is stored anywhere. -->
  <div class="install-overlay hidden" id="shareOverlay">
    <div class="install-panel is-narrow">
      <div class="install-panel-header">
        <h2>Share this signature</h2>
        <button class="btn" id="shareClose">Close</button>
      </div>
      <div class="install-body">
        <p class="share-lead">Anyone with this link can open the signature and copy it — no account, no sign-in.</p>
        <div class="share-row">
          <input type="text" id="shareUrl" class="share-url" readonly spellcheck="false">
          <button class="btn btn-accent" id="shareCopyLink">Copy link</button>
        </div>
        <p class="share-size" id="shareSize"></p>
        <div class="install-actions">
          <a class="btn" id="shareOpen" href="#" target="_blank" rel="noopener">Open it yourself</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Picking where the signature is going: the client list, behind one
       button, with that client's steps once it is chosen. -->
  <div class="install-overlay hidden" id="installOverlay">
    <div class="install-panel">
      <div class="install-panel-header">
        <h2 id="installTitle">Install your signature</h2>
        <button class="btn" id="installClose">Cancel</button>
      </div>
      <div class="install-body" id="installBody"></div>
    </div>
  </div>
  <div class="export-overlay hidden" id="exportOverlay">
    <div class="export-panel">
      <div class="export-panel-header">
        <h2>Export HTML</h2>
        <button class="export-close" id="exportClose">✕</button>
      </div>
      <div class="export-targets-row">
        <div class="toggle-group" id="exportTargets"></div>
        <p class="export-note" id="exportNote"></p>
      </div>
      <pre class="export-code"><code id="exportCode"></code></pre>
      <div class="export-actions">
        <button class="btn btn-accent" id="exportCopyBtn">Copy HTML</button>
      </div>
    </div>
  </div>

  <!-- Cloud layer. Loaded before app.js; the editor works without any of it. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
</body>
</html>
