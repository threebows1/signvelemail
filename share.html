<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A signature to copy — Sign Vel</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" sizes="180x180">
  <meta name="description" content="Someone shared an email signature with you. Copy it straight into Gmail, Outlook, or Apple Mail.">
  <!-- A shared link is a link someone else opens: nothing here needs an
       account, and nothing is stored. The signature named in the URL is read
       from the gallery on the home page, so there is one copy of that markup
       and a shared link can never drift from what the gallery shows. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
</head>
<body class="share-page">
  <header class="share-head">
    <a class="share-brand" href="index.html">Sign&nbsp;Vel</a>
    <a class="btn btn-accent" href="editor.html">Make your own</a>
  </header>

  <main class="share-main">
    <p class="share-kicker" id="shareKicker">A signature was shared with you</p>
    <h1 class="share-title" id="shareTitle">Loading…</h1>

    <div class="share-card">
      <div class="share-canvas" id="shareCanvas"></div>
    </div>

    <div class="share-actions">
      <button class="btn btn-accent" id="shareCopy">Copy signature</button>
      <button class="btn" id="shareCopyHtml">Copy HTML</button>
      <span class="share-feedback" id="shareFeedback"></span>
    </div>

    <p class="share-note">
      Paste it into your mail client's signature box with Ctrl+V, or Cmd+V on a Mac.
      <a href="install.html">Step-by-step for each client</a>.
    </p>
  </main>

  <footer class="share-foot">
    <p>Made with <a href="index.html">Sign Vel</a> · <span class="footer-year"></span></p>
  </footer>

  <script>
  (function () {
    const NAMES = {
      spotlight: 'Spotlight', darkcard: 'Dark card', colorblock: 'Colour block',
      ribbon: 'Ribbon', editorial: 'Editorial', grid: 'Grid',
    };
    const id = (new URLSearchParams(location.search).get('t') || location.hash.replace('#', '') || '').trim();
    const canvas = document.getElementById('shareCanvas');
    const title = document.getElementById('shareTitle');
    const kicker = document.getElementById('shareKicker');

    function fail(msg) {
      kicker.textContent = '';
      title.textContent = 'That link does not point at a signature';
      canvas.innerHTML = '<p class="share-empty">' + msg + '</p>';
      document.querySelector('.share-actions').hidden = true;
    }

    if (!NAMES[id]) { fail('The link is missing the name of a signature, or names one that no longer exists.'); return; }
    title.textContent = NAMES[id];

    // Read it from the gallery rather than keeping a second copy here: one
    // source, so a shared link always shows what the site shows.
    //
    // Both spellings of the home page are tried. The site serves it at "/",
    // but a copy opened from a folder — or served under a path — only has
    // index.html beside it, and "/" there is not the home page at all.
    function loadHome() {
      const tries = [new URL('index.html', location.href).href, '/'];
      return tries.reduce(function (chain, url) {
        return chain.catch(function () {
          return fetch(url, {credentials: 'omit'}).then(function (r) {
            if (!r.ok) throw new Error(r.status);
            return r.text();
          });
        });
      }, Promise.reject());
    }

    loadHome()
      .then(function (html) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const frame = doc.querySelector('#panel-' + id + ' .sig-frame');
        if (!frame) throw new Error('not in the gallery');
        canvas.innerHTML = frame.innerHTML;
        const note = doc.querySelector('#panel-' + id + ' .gallery-note');
        if (note) document.querySelector('.share-note').insertAdjacentHTML('beforebegin',
          '<p class="share-blurb">' + note.textContent + '</p>');
      })
      .catch(function () {
        fail('That signature could not be loaded just now. Try again, or open the gallery on the home page.');
      });

    const feedback = document.getElementById('shareFeedback');
    let resetAt = 0;
    function said(text) {
      feedback.textContent = text;
      const mine = resetAt = Date.now();
      setTimeout(function () { if (resetAt === mine) feedback.textContent = ''; }, 2200);
    }

    // Rich paste: the markup itself on the clipboard, which is what a mail
    // client's signature box wants. The plain-text half is the same markup,
    // so a box that only takes text still gets something usable.
    document.getElementById('shareCopy').addEventListener('click', function () {
      const html = canvas.innerHTML;
      if (!html.trim()) { said('Nothing to copy'); return; }
      if (navigator.clipboard && window.ClipboardItem) {
        navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([html], {type: 'text/html'}),
          'text/plain': new Blob([html], {type: 'text/plain'}),
        })]).then(function () { said('Copied ✓'); }).catch(function () { selectCopy(html); });
        return;
      }
      selectCopy(html);
    });

    document.getElementById('shareCopyHtml').addEventListener('click', function () {
      const html = canvas.innerHTML;
      if (!html.trim()) { said('Nothing to copy'); return; }
      if (!navigator.clipboard || !navigator.clipboard.writeText) { said('Not available'); return; }
      navigator.clipboard.writeText(html).then(function () { said('HTML copied ✓'); })
        .catch(function () { said('Not available'); });
    });

    // The older path, for browsers without ClipboardItem. Its own white
    // ground, so the selection does not pick up the page behind it.
    function selectCopy(html) {
      const el = document.createElement('div');
      el.contentEditable = 'true';
      el.innerHTML = html;
      el.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0;background:#FFFFFF;';
      document.body.appendChild(el);
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      sel.removeAllRanges();
      el.remove();
      said(ok ? 'Copied ✓' : 'Not available');
    }
  })();
  </script>
  <script>document.querySelectorAll(".footer-year").forEach(function (e) { e.textContent = new Date().getFullYear(); });</script>
</body>
</html>
